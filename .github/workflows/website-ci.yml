name: Website CI

on:
  pull_request:
    paths:
      - "Website/**"
      - "Directory.Build.props"
      - "ChartForgeX.sln"
      - "ChartForgeX/**"
      - "ChartForgeX.Visuals/**"
      - "ChartForgeX.Stories/**"
      - "ChartForgeX.Interactivity/**"
      - "ChartForgeX.Interactivity.Html/**"
      - "ChartForgeX.Markup/**"
      - "ChartForgeX.Mermaid/**"
      - "ChartForgeX.Markup.Mermaid/**"
      - "ChartForgeX.Examples/**"
      - "docs/**"
      - ".github/workflows/website-ci.yml"
  push:
    branches: [main]
    paths:
      - "Website/**"
      - "Directory.Build.props"
      - "ChartForgeX.sln"
      - "ChartForgeX/**"
      - "ChartForgeX.Visuals/**"
      - "ChartForgeX.Stories/**"
      - "ChartForgeX.Interactivity/**"
      - "ChartForgeX.Interactivity.Html/**"
      - "ChartForgeX.Markup/**"
      - "ChartForgeX.Mermaid/**"
      - "ChartForgeX.Markup.Mermaid/**"
      - "ChartForgeX.Examples/**"
      - "docs/**"
      - ".github/workflows/website-ci.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-site:
    if: github.event_name == 'pull_request'
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-ci.yml@7cbb9594e6590b41f0d20f528550848c519855e8
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      powerforge_lock_path: ./Website/.powerforge/engine-lock.json
      powerforge_repository_override: ${{ vars.POWERFORGE_REPOSITORY }}
      powerforge_ref_override: ${{ vars.POWERFORGE_REF }}

  verify-site-trusted:
    if: github.event_name != 'pull_request'
    # Use the canonical runner directly; the CI wrapper cancels by branch.
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-run.yml@7cbb9594e6590b41f0d20f528550848c519855e8
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      powerforge_lock_path: ./Website/.powerforge/engine-lock.json
      powerforge_repository_override: ${{ vars.POWERFORGE_REPOSITORY }}
      powerforge_ref_override: ${{ vars.POWERFORGE_REF }}
      pipeline_mode: ci
      credential_mode: standard
      use_playwright_cache: true
