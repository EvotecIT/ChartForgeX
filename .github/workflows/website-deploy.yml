name: Validate Website and Apply Cloudflare Policy

on:
  push:
    branches: [main]
    paths:
      - "Website/**"
      - "Directory.Build.props"
      - "ChartForgeX.sln"
      - "ChartForgeX/**"
      - "ChartForgeX.Visuals/**"
      - "ChartForgeX.Stories/**"
      - "ChartForgeX.Interactivity/**"
      - "ChartForgeX.Interactivity.Html/**"
      - "ChartForgeX.Markup/**"
      - "ChartForgeX.Mermaid/**"
      - "ChartForgeX.Markup.Mermaid/**"
      - "ChartForgeX.Examples/**"
      - "docs/**"
      - ".github/workflows/website-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chartforgex-website-production
  cancel-in-progress: false

jobs:
  build:
    permissions:
      actions: write
      contents: read
      packages: read
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-run.yml@77a10b3d2b8cf3608d5b08747f273ae38e055479
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      source_ref: ${{ github.sha }}
      engine_mode: source
      runner_labels_json: '["ubuntu-latest"]'
      timeout_minutes: 60
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: 77a10b3d2b8cf3608d5b08747f273ae38e055479
      report_artifact_name: chartforgex-website-deploy-reports
      site_artifact_name: powerforge-site-chartforgex.com
      site_artifact_retention_days: 7
    secrets:
      indexnow_key: ${{ secrets.INDEXNOW_KEY }}

  site-policy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}

      - name: Apply managed Cloudflare site policy
        uses: EvotecIT/PSPublishModule/.github/actions/powerforge-cloudflare-site-policy@77a10b3d2b8cf3608d5b08747f273ae38e055479
        with:
          site-config: Website/site.json
          checkout-caller: "false"
          zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
