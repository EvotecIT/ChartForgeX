name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Website/**"
      - "Directory.Build.props"
      - "ChartForgeX.sln"
      - "ChartForgeX/**"
      - "ChartForgeX.Visuals/**"
      - "ChartForgeX.Stories/**"
      - "ChartForgeX.Interactivity/**"
      - "ChartForgeX.Interactivity.Html/**"
      - "ChartForgeX.Markup/**"
      - "ChartForgeX.Mermaid/**"
      - "ChartForgeX.Markup.Mermaid/**"
      - "ChartForgeX.Examples/**"
      - "docs/**"
      - ".github/workflows/website-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chartforgex-website-production
  cancel-in-progress: false

jobs:
  website-deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      actions: write
      contents: read
      deployments: read
      packages: read
      pages: write
      id-token: write
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-deploy.yml@643e034ed1f9a161bb9e6dd80fd5204a8269c50b
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      source_ref: ${{ github.sha }}
      site_output_path: Website/_site
      engine_mode: source
      runner_labels_json: '["ubuntu-latest"]'
      build_timeout_minutes: 60
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: 643e034ed1f9a161bb9e6dd80fd5204a8269c50b
      report_artifact_name: chartforgex-website-deploy-reports
      deployment_target: github-pages
    secrets:
      indexnow_key: ${{ secrets.INDEXNOW_KEY }}

  site-policy:
    needs: website-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply managed Cloudflare site policy
        uses: EvotecIT/PSPublishModule/.github/actions/powerforge-cloudflare-site-policy@643e034ed1f9a161bb9e6dd80fd5204a8269c50b
        with:
          site-config: Website/site.json
          checkout-caller: "false"
          zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
