name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# PRs replace only earlier runs for the same PR. Every other event is independent,
# including queued main pushes and manual full-matrix runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Select Quality coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      standalone: ${{ steps.plan.outputs.standalone }}
      browser_filter: ${{ steps.plan.outputs.browser_filter }}
    steps:
      - name: Checkout complete PR history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect build and test inputs
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const {appendFileSync} = require('node:fs');
          let build = true;
          let standalone = true;
          let browserFilter = '';
          if (process.env.GITHUB_EVENT_NAME === 'pull_request') {
            const {BASE_SHA: base, HEAD_SHA: head} = process.env;
            if (![base, head].every(sha => /^[0-9a-f]{40}$/.test(sha || ''))) {
              throw new Error('Both PR revisions are required for coverage selection.');
            }
            // Three-dot diff covers the whole PR. Disabling renames checks both
            // the removed and added path, so a move out of source cannot hide it.
            const paths = execFileSync('git', ['diff', '--name-only', '--no-renames', '-z', `${base}...${head}`],
              {encoding: 'utf8', maxBuffer: 16 * 1024 * 1024}).split('\0').filter(Boolean);
            const documentation = path => {
              // These files are packaged, generated, or read by real tests.
              if (/^(README[^/]*|CONTRIBUTING|TODO|AGENTS|CHANGELOG)\.md$/i.test(path) ||
                  /^docs\/dom-contract\.md$/i.test(path) ||
                  /^docs\/dashboard-pattern-expansion-plan\.md$/i.test(path) ||
                  /(^|\/)(schemas?|generated|fixtures|apidocs)(\/|\.)/i.test(path) ||
                  /^(ChartForgeX[^/]*|Build|Benchmarks|tests)\//.test(path) ||
                  /^Website\/(data\/|build\/|powershell\/|static\/examples\/|static\/site\/|site\.json$)/.test(path)) return false;
              if (/^Website\//.test(path)) return true;
              if (/^docs\/.*\.md$/i.test(path)) return true;
              return /^[^/]+\.md$/i.test(path);
            };
            build = paths.length === 0 || !paths.every(documentation);
            const browserInput = path => /^ChartForgeX\.Tests\/[^/]*Browser[^/]*\.cs$/.test(path);
            standalone = paths.some(path => browserInput(path) || /^(ChartForgeX\.Interactivity[^/]*\/|ChartForgeX\.Tests\/InteractiveBundleTests\.cs$|ChartForgeX\.Examples\/HtmlCrosshairExamples\.cs$|Build\/(InteractiveBundle\.cs|Sync-InteractiveAssets\.ps1|Test-BrowserCompatibility\.ps1)$|\.github\/workflows\/quality\.yml$)/.test(path));
            const browserPaths = paths.filter(browserInput);
            const browserClasses = [...new Set(browserPaths.flatMap(path => {
              const match = /^ChartForgeX\.Tests\/([A-Za-z_][A-Za-z0-9_]*BrowserTests)(?:\.[A-Za-z0-9_]+)*\.cs$/.exec(path);
              return match ? [match[1]] : [];
            }))];
            const clauses = new Set(['StandaloneViewportBrowserTests', 'InteractiveBundleTests', ...browserClasses]);
            // Keep Chromium-only rows out of the declared cross-engine compatibility lane.
            browserFilter = `Category=Browser&BrowserSuite=Compatibility&(${[...clauses].map(name => `FullyQualifiedName~${name}`).join('|')})`;
            // Unrecognised partial filenames must broaden coverage rather than silently omit tests.
            if (browserPaths.some(path => !/^ChartForgeX\.Tests\/([A-Za-z_][A-Za-z0-9_]*BrowserTests)(?:\.[A-Za-z0-9_]+)*\.cs$/.test(path))) {
              browserFilter = 'Category=Browser&BrowserSuite=Compatibility';
            }
            console.log(`Compared ${paths.length} PR paths; build/test required: ${build}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `build=${build}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `standalone=${standalone}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `browser_filter=${browserFilter}\n`);
          NODE

  quality-gates:
    # Keep the PR platform/browser contexts for an explicitly selected docs-only skip.
    name: ${{ matrix.check }}
    needs: [changes, build-test-pack, browser-quality, browser-compatibility, browser-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Build, test, examples, pack (Linux)
            job: build-test-pack
          - check: Build, test, examples, pack (Windows)
            job: build-test-pack
          - check: Required browser contracts (Windows Chromium)
            job: browser-quality
    steps:
      - name: Require selected coverage
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          WORK_RESULT: ${{ needs[matrix.job].result }}
          COMPATIBILITY_RESULT: ${{ needs.browser-compatibility.result }}
          SHARDS_RESULT: ${{ needs.browser-shards.result }}
          STANDALONE_REQUIRED: ${{ needs.changes.outputs.standalone }}
        shell: bash
        run: |
          test "$CHANGES_RESULT" = success || { echo 'Coverage selection failed.'; exit 1; }
          if [ "$BUILD_REQUIRED" = false ]; then
            test "$WORK_RESULT" = skipped || { echo 'Unexpected docs-only result.'; exit 1; }
            echo 'Documentation/website-only PR; heavy coverage is not required.'
          elif [ "$BUILD_REQUIRED" != true ]; then
            echo 'Coverage selection did not return a valid decision.'; exit 1
          else
            test "$WORK_RESULT" = success || { echo "Selected coverage failed: $WORK_RESULT"; exit 1; }
            test "$SHARDS_RESULT" = success || { echo "Chromium shards did not cover the suite exactly once: $SHARDS_RESULT"; exit 1; }
            if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$STANDALONE_REQUIRED" = true ]; then
              test "$COMPATIBILITY_RESULT" = success || { echo 'macOS browser coverage failed.'; exit 1; }
            fi
          fi

  build-test-pack:
    name: Quality work (${{ matrix.name }}, ${{ matrix.lane }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # Linux and Windows run the test lane (conformance, unit and raster-stress contracts) beside the
      # package lane (Native AOT, examples, gallery contracts, packing). main pushes and manual runs
      # add one complete macOS job, keeping scarce macOS runners to a single Quality job.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"name":"Linux","runner":"ubuntu-latest","lane":"tests"},{"name":"Linux","runner":"ubuntu-latest","lane":"package"},{"name":"Windows","runner":"windows-latest","lane":"tests"},{"name":"Windows","runner":"windows-latest","lane":"package"}]}' || '{"include":[{"name":"Linux","runner":"ubuntu-latest","lane":"tests"},{"name":"Linux","runner":"ubuntu-latest","lane":"package"},{"name":"Windows","runner":"windows-latest","lane":"tests"},{"name":"Windows","runner":"windows-latest","lane":"package"},{"name":"macOS","runner":"macos-latest","lane":"complete"}]}') }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Keep NuGet folders on the Windows work disk
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-nuget-folders

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET 8 for Windows packed consumers
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install packed-consumer qualification tooling
        if: runner.os == 'Windows' && matrix.lane != 'tests'
        shell: pwsh
        run: |
          Install-Module -Name PSPublishModule -RequiredVersion 3.0.168 -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop
          Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' -Name Version, Release -ErrorAction Stop |
            Select-Object Version, Release | ConvertTo-Json |
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'chartforgex-framework-runtime.json') -Encoding utf8

      - name: Setup Node.js for Mermaid conformance
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux' && matrix.lane != 'tests'
        shell: bash
        run: |
          install_with_sudo() {
            if command -v sudo >/dev/null 2>&1; then
              sudo "$@"
            else
              "$@"
            fi
          }

          dotnet nuget locals all --clear >/dev/null 2>&1 || true

          has_native_aot_compiler() {
            command -v clang >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1
          }

          has_native_aot_headers() {
            if command -v dpkg-query >/dev/null 2>&1; then
              dpkg-query -W -f='${Status}' zlib1g-dev 2>/dev/null | grep -q "install ok installed"
            elif command -v rpm >/dev/null 2>&1; then
              rpm -q zlib-devel zlib-ng-devel zlib-ng-compat-devel >/dev/null 2>&1
            elif command -v apk >/dev/null 2>&1; then
              apk info -e zlib-dev >/dev/null 2>&1 && apk info -e musl-dev >/dev/null 2>&1
            else
              false
            fi
          }

          if has_native_aot_compiler && has_native_aot_headers; then
            exit 0
          fi

          if command -v apt-get >/dev/null 2>&1; then
            apt_packages=()
            if ! has_native_aot_compiler; then
              apt_packages+=(gcc)
            fi
            if ! dpkg-query -W -f='${Status}' zlib1g-dev 2>/dev/null | grep -q "install ok installed"; then
              apt_packages+=(zlib1g-dev)
            fi

            if [ ${#apt_packages[@]} -eq 0 ]; then
              exit 0
            fi

            install_with_sudo apt-get clean
            if ! find /var/lib/apt/lists -type f -name '*_Packages*' 2>/dev/null | grep -q .; then
              install_with_sudo apt-get update -o Acquire::Languages=none
            fi
            install_with_sudo apt-get install -y --no-install-recommends "${apt_packages[@]}"
            install_with_sudo apt-get clean
          elif command -v dnf >/dev/null 2>&1; then
            dnf_packages=()
            if ! has_native_aot_compiler; then
              dnf_packages+=(gcc)
            fi
            for package in zlib-devel zlib-ng-devel zlib-ng-compat-devel; do
              if ! rpm -q "$package" >/dev/null 2>&1; then
                dnf_packages+=("$package")
              fi
            done

            if [ ${#dnf_packages[@]} -gt 0 ]; then
              install_with_sudo dnf install -y "${dnf_packages[@]}"
            fi
          elif command -v yum >/dev/null 2>&1; then
            yum_packages=()
            if ! has_native_aot_compiler; then
              yum_packages+=(gcc)
            fi
            for package in zlib-devel zlib-ng-devel zlib-ng-compat-devel; do
              if ! rpm -q "$package" >/dev/null 2>&1; then
                yum_packages+=("$package")
              fi
            done

            if [ ${#yum_packages[@]} -gt 0 ]; then
              install_with_sudo yum install -y "${yum_packages[@]}"
            fi
          elif command -v apk >/dev/null 2>&1; then
            apk_packages=()
            if ! has_native_aot_compiler || ! apk info -e musl-dev >/dev/null 2>&1; then
              apk_packages+=(build-base)
            fi
            if ! apk info -e zlib-dev >/dev/null 2>&1; then
              apk_packages+=(zlib-dev)
            fi

            if [ ${#apk_packages[@]} -gt 0 ]; then
              install_with_sudo apk add --no-cache "${apk_packages[@]}"
            fi
          else
            echo "No supported package manager found. Install clang or gcc plus zlib development headers for Native AOT."
            exit 1
          fi

      - name: Run quality loop
        shell: pwsh
        env:
          LANE: ${{ matrix.lane }}
        run: |
          $options = @{
              Configuration = 'Release'
              DotNetCommandTimeoutSeconds = 1800
              TestDiagnosticsDirectory = Join-Path $env:RUNNER_TEMP 'chartforgex-native-results'
          }
          switch ($env:LANE) {
              'tests' { $options.SkipAot = $true; $options.SkipExamples = $true; $options.SkipPack = $true }
              'package' { $options.SkipTests = $true; $options.QualifyPackages = $env:RUNNER_OS -eq 'Windows' }
              'complete' { $options.QualifyPackages = $env:RUNNER_OS -eq 'Windows' }
              default { throw "Unknown Quality lane: $env:LANE" }
          }
          ./Build.ps1 @options

      - name: Retain native test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chartforgex-native-results-${{ matrix.name }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/chartforgex-native-results
          if-no-files-found: warn
          retention-days: 7

      - name: Export Website API documentation bundle
        if: runner.os == 'Linux' && matrix.lane != 'tests'
        shell: pwsh
        run: ./Build/Export-WebsiteApiDocs.ps1 -SkipBuild

      - name: Retain packed-consumer qualification reports
        if: always() && runner.os == 'Windows' && matrix.lane != 'tests'
        uses: actions/upload-artifact@v7
        with:
          name: chartforgex-package-qualification-Windows
          path: |
            artifacts/packages/Release/qualification/*.json
            ${{ runner.temp }}/chartforgex-framework-runtime.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload packages
        if: matrix.lane != 'tests'
        uses: actions/upload-artifact@v7
        with:
          name: chartforgex-packages-${{ matrix.runner }}
          path: |
            artifacts/packages/Release/*.nupkg
            artifacts/packages/Release/*.snupkg
          if-no-files-found: error

      - name: Upload example gallery
        if: matrix.lane != 'tests'
        uses: actions/upload-artifact@v7
        with:
          name: chartforgex-example-gallery-${{ matrix.runner }}
          path: ChartForgeX.Examples/bin/Release/net8.0/output
          if-no-files-found: error

  browser-quality:
    name: Browser contract work (Windows Chromium ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    # The unsharded suite measured 43 minutes of tests plus about 5 minutes of setup.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Keep NuGet folders on the Windows work disk
        uses: ./.github/actions/windows-nuget-folders

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Generate gallery and execute required browser proof
        shell: pwsh
        run: ./Build/Test-BrowserQuality.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'chartforgex-browser-quality') -ShardIndex ${{ matrix.shard }} -ShardCount 4

      - name: Retain shard manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chartforgex-browser-shard-chromium-${{ matrix.shard }}
          path: ${{ runner.temp }}/chartforgex-browser-quality/results/shard.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain browser results and rendered evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chartforgex-browser-quality-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/chartforgex-browser-quality/results
            ${{ runner.temp }}/chartforgex-browser-quality/captures
            ${{ runner.temp }}/chartforgex-browser-quality/gallery-server.log
          if-no-files-found: error
          retention-days: 7

  browser-compatibility:
    name: Browser compatibility (macOS ${{ matrix.name }} ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.build == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.standalone == 'true')
    runs-on: macos-latest
    # The serial compatibility rows run in three parallel shards of whole test classes, so each shard
    # (setup, about a third of the rows, evidence) stays well inside the envelope; a single serial job
    # had grown past two hours on Firefox.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2, 3]
        include:
          - browser: firefox
            name: Firefox
          - browser: webkit
            name: WebKit
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Execute ${{ matrix.name }} contracts
        shell: pwsh
        env:
          FOCUSED_STANDALONE: ${{ github.event_name == 'pull_request' }}
          CHANGED_BROWSER_FILTER: ${{ needs.changes.outputs.browser_filter }}
        run: |
          $options = @{
              Browser = '${{ matrix.browser }}'
              OutputRoot = Join-Path $env:RUNNER_TEMP 'chartforgex-${{ matrix.browser }}'
              ShardIndex = ${{ matrix.shard }}
              ShardCount = 3
          }
          if ($env:FOCUSED_STANDALONE -eq 'true') {
              if (-not $env:CHANGED_BROWSER_FILTER) { throw 'Changed-browser coverage filter is missing.' }
              $options.Filter = $env:CHANGED_BROWSER_FILTER
          }
          ./Build/Test-BrowserCompatibility.ps1 @options
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chartforgex-browser-compatibility-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/chartforgex-${{ matrix.browser }}/results
            ${{ runner.temp }}/chartforgex-${{ matrix.browser }}/captures
          if-no-files-found: error
          retention-days: 7

  browser-shards:
    name: Browser shard coverage
    needs: [changes, browser-quality]
    if: always() && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: Build
          persist-credentials: false
      - name: Download shard manifests
        uses: actions/download-artifact@v8
        with:
          pattern: chartforgex-browser-shard-*
          path: ${{ runner.temp }}/browser-shards
      - name: Require every listed class exactly once
        shell: pwsh
        run: ./Build/Test-BrowserShardCoverage.ps1 -ManifestRoot (Join-Path $env:RUNNER_TEMP 'browser-shards') -Suite chromium-required
