<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <rect width="960" height="440" rx="20" fill="#111827"/>
  <text x="36" y="52" font-family="sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Styled multilingual text</text>
  <text x="36" y="84" font-family="sans-serif" font-size="15" fill="#94a3b8">One text chunk keeps its reading order across styled spans.</text>
  <rect x="28" y="110" width="904" height="90" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="48" y="138" font-family="sans-serif" font-size="13" fill="#38bdf8">HEBREW · MIXED LABELS AND NUMBERS</text>
  <text x="48" y="176" font-family="sans-serif" font-size="26" fill="#f8fafc">Servers: <tspan fill="#fbbf24">שרתים</tspan> <tspan fill="#a78bfa">פעילים</tspan> 123 · OK</text>
  <rect x="28" y="214" width="904" height="90" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="48" y="242" font-family="sans-serif" font-size="13" fill="#34d399">ARABIC · JOINING ACROSS COLORS</text>
  <text x="48" y="280" font-family="sans-serif" font-size="30" fill="#f8fafc">Status: <tspan fill="#fb7185">مر</tspan><tspan fill="#2dd4bf">حبا</tspan> · 24 · <tspan fill="#fb7185">ل</tspan><tspan fill="#2dd4bf" font-size="38">ا</tspan></text>
  <text x="48" y="348" font-family="sans-serif" font-size="14" fill="#94a3b8">Explicit positions start separate text chunks.</text>
  <text x="48" y="388" font-family="sans-serif" font-size="25" fill="#f8fafc"><tspan x="48" fill="#fbbf24">שרתים</tspan><tspan x="400" fill="#a78bfa">פעילים</tspan><tspan x="752" fill="#34d399">123</tspan></text>
</svg>
