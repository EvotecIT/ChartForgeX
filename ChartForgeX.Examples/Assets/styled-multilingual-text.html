<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Styled multilingual text · ChartForgeX</title>
  <style>
    body { margin: 0; padding: 24px; background:linear-gradient(180deg,#0b1220,#101c30); color: #e2e8f0; font: 16px system-ui, sans-serif; -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision; }
    main { max-width: 1100px; margin: auto; }
    h1 { font-size: 24px; }
    figure { margin: 28px 0; }
    img { display: block; width: 100%; height: auto; border-radius: 16px; }
    svg { display: block; width: 100%; height: auto; overflow:visible; }
    figcaption { margin-bottom: 10px; color: #94a3b8; }
    a { color: #38bdf8; }
    @media (max-width: 600px) { body { padding: 12px; } }
    @media print { body { padding: 0; background:transparent; color: #111827; } figure { break-inside: avoid; } }
  </style>
</head>
<body>
  <main>
    <h1>Styled multilingual text</h1>
    <p>Compare reading order, Arabic joining and span colors in browser SVG and exported PNG.</p>
    <figure><figcaption>SVG rendered by the browser</figcaption>{{SVG}}</figure>
    <figure><figcaption>PNG rendered by ChartForgeX</figcaption><img src="styled-multilingual-text.png" alt="The same styled Hebrew and Arabic text exported to PNG"></figure>
    <p><a href="styled-multilingual-text.svg">SVG</a> · <a href="styled-multilingual-text.png">PNG</a></p>
  </main>
</body>
</html>
