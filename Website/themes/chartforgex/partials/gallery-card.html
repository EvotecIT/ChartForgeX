<li class="cfx-card" data-category="{{ item.category }}">
  <button type="button" class="cfx-card__open" data-cfx-gallery-open
    data-title="{{ item.title | html.escape }}" data-family="{{ item.familyLabel | html.escape }}"
    data-image="{{ item.image }}" data-dark-image="{{ item.darkImage }}"
    data-source="{{ item.source }}" data-dark-source="{{ item.darkSource }}"
    data-html="{{ item.html }}" data-dark-html="{{ item.darkHtml }}">
    <span class="cfx-card__media">
      <img class="cfx-only-light" src="{{ item.thumbnail }}" width="400" height="280" loading="lazy" decoding="async" alt="" />
      <img class="cfx-only-dark" src="{{ item.darkThumbnail }}" width="400" height="280" loading="lazy" decoding="async" alt="" />
    </span>
    <span class="cfx-card__family">{{ item.familyLabel }}</span>
    <span class="cfx-card__title">{{ item.title }}</span>
  </button>
</li>
