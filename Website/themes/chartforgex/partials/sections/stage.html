<section class="cfx-section cfx-surfaces-demo" aria-labelledby="cfx-surfaces-demo-title">
  <div class="cfx-section__head">
    <h2 id="cfx-surfaces-demo-title">One definition, every surface</h2>
    <p>The same chart object writes vector SVG, native PNG, a script-free HTML page or an interactive one, an email-ready image and a Markdown fence. Switch the tabs; every file below was written by ChartForgeX.</p>
  </div>
  <figure class="cfx-stage" data-cfx-stage>
    <div class="cfx-stage__tabs" role="tablist" aria-label="Output surface">
      {{~ for s in data.home.surfaces ~}}
      <button type="button" role="tab" id="cfx-tab-{{ s.id }}" aria-controls="cfx-panel-{{ s.id }}" aria-selected="{{ if s.id == "svg" }}true{{ else }}false{{ end }}" tabindex="{{ if s.id == "svg" }}0{{ else }}-1{{ end }}" data-cfx-surface="{{ s.id }}">{{ s.label }}</button>
      {{~ end ~}}
    </div>

    <div class="cfx-stage__screen">
      <div class="cfx-panel cfx-panel--code" role="tabpanel" id="cfx-panel-csharp" aria-labelledby="cfx-tab-csharp" hidden>
<pre class="cfx-code"><code><span class="k">var</span> chart = <span class="t">Chart</span>.Create()
    .WithTitle(<span class="s">"Sign-ins by method"</span>)
    .WithSubtitle(<span class="s">"Weekly sign-ins across the tenant, last 12 weeks"</span>)
    .WithYAxis(<span class="s">"Sign-ins"</span>)
    .WithDesignTokens(<span class="t">VisualDesignTokens</span>.GraphiteLight())
    .WithXLabels(weeks)
    .AddStackedArea(<span class="s">"Passkey"</span>, Points(<span class="n">800</span>, <span class="n">1200</span>, <span class="n">1700</span>, <span class="c">/* … */</span> <span class="n">8900</span>))
    .AddStackedArea(<span class="s">"Authenticator app"</span>, Points(<span class="n">7200</span>, <span class="c">/* … */</span> <span class="n">6200</span>))
    .AddStackedArea(<span class="s">"SMS code"</span>, Points(<span class="n">4200</span>, <span class="c">/* … */</span> <span class="n">1300</span>))
    .AddStackedArea(<span class="s">"Password only"</span>, Points(<span class="n">5600</span>, <span class="c">/* … */</span> <span class="n">1500</span>));

chart.SaveSvg(<span class="s">"sign-ins.svg"</span>);
chart.SavePng(<span class="s">"sign-ins.png"</span>);
chart.SaveHtml(<span class="s">"sign-ins.html"</span>);</code></pre>
      </div>

      <div class="cfx-panel cfx-panel--svg" role="tabpanel" id="cfx-panel-svg" aria-labelledby="cfx-tab-svg">
        {{ include "generated/hero-svg" }}
      </div>

      <div class="cfx-panel cfx-panel--png" role="tabpanel" id="cfx-panel-png" aria-labelledby="cfx-tab-png" hidden>
        <img class="cfx-only-light" src="/site/hero-light.png" width="960" height="540" loading="lazy" decoding="async" alt="Sign-ins by method, rendered as PNG: passkey sign-ins grow from 800 to 8,900 a week while password-only and SMS sign-ins decline." />
        <img class="cfx-only-dark" src="/site/hero-dark.png" width="960" height="540" loading="lazy" decoding="async" alt="Sign-ins by method, rendered as PNG in the dark theme." />
      </div>

      <div class="cfx-panel cfx-panel--html" role="tabpanel" id="cfx-panel-html" aria-labelledby="cfx-tab-html" hidden>
        <div class="cfx-browser">
          <div class="cfx-browser__bar">
            <span class="cfx-browser__dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="cfx-browser__url" data-cfx-html-url>sign-ins.html</span>
            <span class="cfx-segment" role="group" aria-label="HTML variant">
              <button type="button" aria-pressed="true" data-cfx-html-mode="static">Static</button>
              <button type="button" aria-pressed="false" data-cfx-html-mode="interactive">Interactive</button>
            </span>
          </div>
          <iframe title="Sign-ins by method as an HTML page" data-cfx-html-frame loading="lazy"></iframe>
        </div>
      </div>

      <div class="cfx-panel cfx-panel--email" role="tabpanel" id="cfx-panel-email" aria-labelledby="cfx-tab-email" hidden>
        <div class="cfx-mail">
          <dl class="cfx-mail__head">
            <div><dt>From</dt><dd>Identity reports</dd></div>
            <div><dt>Subject</dt><dd>Sign-ins this week: passkeys passed 8,900</dd></div>
          </dl>
          <div class="cfx-mail__body">
            <p>Good morning. Passkey sign-ins grew again this week, and password-only sign-ins fell to 1,500.</p>
            <img class="cfx-only-light" src="/site/hero-light.png" width="960" height="540" loading="lazy" decoding="async" alt="Passkey sign-ins grow from 800 to 8,900 a week while password-only and SMS sign-ins decline." />
            <img class="cfx-only-dark" src="/site/hero-dark.png" width="960" height="540" loading="lazy" decoding="async" alt="Passkey sign-ins grow from 800 to 8,900 a week while password-only and SMS sign-ins decline." />
          </div>
        </div>
      </div>

      <div class="cfx-panel cfx-panel--markdown" role="tabpanel" id="cfx-panel-markdown" aria-labelledby="cfx-tab-markdown" hidden>
        <pre class="cfx-code cfx-code--fence"><code>{{ include "generated/hero-fence" }}</code></pre>
        <div class="cfx-panel__render">
          <img class="cfx-only-light" src="/site/hero-markdown-light.svg" width="960" height="540" loading="lazy" decoding="async" alt="The sign-ins chart rendered from the Markdown fence." />
          <img class="cfx-only-dark" src="/site/hero-markdown-dark.svg" width="960" height="540" loading="lazy" decoding="async" alt="The sign-ins chart rendered from the Markdown fence, dark theme." />
        </div>
      </div>
    </div>

    <figcaption class="cfx-stage__caption">
      {{~ for s in data.home.surfaces ~}}
      <p data-cfx-caption="{{ s.id }}"{{ if s.id != "svg" }} hidden{{ end }}>{{ s.caption }}{{ if s.size }} <span class="cfx-stage__size">{{ data.hero.sizes[s.size] }}</span>{{ end }}</p>
      {{~ end ~}}
    </figcaption>
  </figure>
</section>
