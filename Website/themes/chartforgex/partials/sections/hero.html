{{~ hero = data.home.hero ~}}
<section class="cfx-hero cfx-tone-dark" aria-labelledby="cfx-intro-title">
  <div class="cfx-hero__inner">
    <h1 id="cfx-intro-title" class="cfx-hero__title"><span>{{ hero.title_line_1 }}</span> <span class="cfx-hero__accent">{{ hero.title_line_2 }}</span></h1>
    <div class="cfx-hero__side">
      <p class="cfx-hero__lede">{{ hero.lede }}</p>
      <div class="cfx-hero__actions">
        <a class="cfx-btn cfx-btn--glow" href="{{ hero.primary.url }}">{{ hero.primary.label }}</a>
        <a class="cfx-btn cfx-btn--ghost" href="{{ hero.secondary.url }}">{{ hero.secondary.label }}</a>
      </div>
      <ul class="cfx-hero__badges" aria-label="Highlights">
        {{~ for b in hero.badges ~}}<li>{{ b }}</li>{{~ end ~}}
      </ul>
    </div>
  </div>

  <div class="cfx-hero__art">
    <figure class="cfx-window">
      <div class="cfx-window__bar">
        <span class="cfx-window__dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="cfx-window__name">identity-overview.png</span>
        <span class="cfx-window__chips" aria-hidden="true"><b>PNG</b><b>SVG</b><b>HTML</b></span>
      </div>
      <img src="/site/dashboard-dark.png" width="3280" height="1408" fetchpriority="high" decoding="async"
        alt="A dark dashboard rendered by ChartForgeX: sign-ins by method as a stacked area, this week's share as a donut, a security posture radar, sign-ins by hour as a heatmap and an MFA coverage gauge at 87." />
    </figure>

    <figure class="cfx-float cfx-float--code" aria-label="C# that builds the dashboard">
      <figcaption><span class="cfx-float__dot cfx-float__dot--cs" aria-hidden="true"></span>Report.cs</figcaption>
<pre><code><span class="k">var</span> report = <span class="t">ChartGrid</span>.Create()
    .WithColumns(<span class="n">3</span>)
    .Add(signIns, columnSpan: <span class="n">2</span>)
    .Add(methods).Add(posture)
    .Add(byHour).Add(coverage);

report.SavePng(<span class="s">"identity-overview.png"</span>);</code></pre>
    </figure>

    <figure class="cfx-float cfx-float--ps" aria-label="The same engine from PowerShell with ImagePlayground">
      <figcaption><span class="cfx-float__dot cfx-float__dot--ps" aria-hidden="true"></span>Usage.ps1 <em>ImagePlayground</em></figcaption>
<pre><code>New-ImageChart {
    <span class="t">New-ImageChartDonut</span> -Name <span class="s">'Used'</span> -Value <span class="n">72</span>
    <span class="t">New-ImageChartDonut</span> -Name <span class="s">'Free'</span> -Value <span class="n">28</span>
} -Theme Dark -FilePath <span class="s">usage.png</span></code></pre>
    </figure>
  </div>
</section>
