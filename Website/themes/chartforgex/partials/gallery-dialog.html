<dialog class="cfx-viewer" data-cfx-viewer aria-labelledby="cfx-viewer-title">
  <div class="cfx-viewer__head">
    <div>
      <p class="cfx-viewer__family" data-cfx-viewer-family></p>
      <h2 id="cfx-viewer-title" data-cfx-viewer-title></h2>
    </div>
    <button type="button" class="cfx-viewer__close" data-cfx-viewer-close aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="cfx-viewer__body">
    <div class="cfx-viewer__image"><img data-cfx-viewer-image alt="" /></div>
    <div class="cfx-viewer__source">
      <div class="cfx-viewer__links">
        <a data-cfx-viewer-svg href="#">Open SVG</a>
        <a data-cfx-viewer-html href="#">Open HTML page</a>
        <button type="button" class="cfx-copy" data-cfx-viewer-copy>Copy C#</button>
      </div>
      <pre class="cfx-code"><code data-cfx-viewer-code>Loading source…</code></pre>
    </div>
  </div>
</dialog>
