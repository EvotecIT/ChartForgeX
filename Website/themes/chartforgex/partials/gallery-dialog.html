<dialog class="cfx-viewer" data-cfx-viewer aria-labelledby="cfx-viewer-title">
  <div class="cfx-viewer__head">
    <div class="cfx-viewer__titles">
      <h2 id="cfx-viewer-title" data-cfx-viewer-title></h2>
      <p class="cfx-viewer__family" data-cfx-viewer-family></p>
    </div>
    <div class="cfx-viewer__links">
      <a class="cfx-viewer__link" data-cfx-viewer-svg href="#">Open SVG</a>
      <a class="cfx-viewer__link" data-cfx-viewer-html href="#">Open HTML page</a>
    </div>
    <button type="button" class="cfx-viewer__close" data-cfx-viewer-close aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="cfx-viewer__body">
    <div class="cfx-viewer__image"><img data-cfx-viewer-image alt="" /></div>
    <figure class="cfx-codeblock cfx-viewer__source" data-lang="csharp">
      <figcaption class="cfx-codeblock__bar">
        <span class="cfx-codeblock__lang">C#</span>
        <span class="cfx-codeblock__file" data-cfx-viewer-file></span>
        <span class="cfx-codeblock__actions"><a class="cfx-codeblock__btn" data-cfx-viewer-download href="#" download>Download</a></span>
      </figcaption>
      <pre><code class="language-csharp" data-cfx-viewer-code>Loading source…</code></pre>
    </figure>
  </div>
</dialog>
