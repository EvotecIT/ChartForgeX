<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="From source to chart — Write the chart" aria-labelledby="cfx-v2-191a87a341005a5389b868b1546b4916b93f17925176d6e5770d4a1fdeadec9a-title" aria-describedby="cfx-v2-191a87a341005a5389b868b1546b4916b93f17925176d6e5770d4a1fdeadec9a-description"><title id="cfx-v2-191a87a341005a5389b868b1546b4916b93f17925176d6e5770d4a1fdeadec9a-title">From source to chart — Write the chart</title><desc id="cfx-v2-191a87a341005a5389b868b1546b4916b93f17925176d6e5770d4a1fdeadec9a-description">From source to chart

1. Write the chart
   Language: csharp
   var chart = Chart.Create()
       .WithTitle("Sign-ins by method")
       .AddStackedArea("Passkey", passkey)
       .AddStackedArea("Password", password);
   chart.SaveSvg("sign-ins.svg");

2. Run it
   [PowerShell] PS C:\Reports&gt; dotnet run
   [PowerShell] Wrote sign-ins.svg
   [PowerShell] PS C:\Reports&gt; 

3. Read the result
   Language: csharp
