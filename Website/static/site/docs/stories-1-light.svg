1. Write the chart
   Language: csharp
   var chart = Chart.Create()
       .WithTitle("Sign-ins by method")
       .AddStackedArea("Passkey", passkey)
       .AddStackedArea("Password", password);
   chart.SaveSvg("sign-ins.svg");

2. Run it
   [PowerShell] PS C:\Reports&gt; dotnet run
   [PowerShell] Wrote sign-ins.svg
   [PowerShell] PS C:\Reports&gt; 

3. Read the result
   Language: csharp
