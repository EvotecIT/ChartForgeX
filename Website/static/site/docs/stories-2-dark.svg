<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="From source to chart — Run it" aria-labelledby="cfx-v2-8ebfc8c997d087a501fd5e99559eb3b6cfa78cc754a2e7f35a60383002987159-title" aria-describedby="cfx-v2-8ebfc8c997d087a501fd5e99559eb3b6cfa78cc754a2e7f35a60383002987159-description"><title id="cfx-v2-8ebfc8c997d087a501fd5e99559eb3b6cfa78cc754a2e7f35a60383002987159-title">From source to chart — Run it</title><desc id="cfx-v2-8ebfc8c997d087a501fd5e99559eb3b6cfa78cc754a2e7f35a60383002987159-description">From source to chart

1. Write the chart
   Language: csharp
   var chart = Chart.Create()
       .WithTitle("Sign-ins by method")
       .AddStackedArea("Passkey", passkey)
       .AddStackedArea("Password", password);
   chart.SaveSvg("sign-ins.svg");

2. Run it
   [PowerShell] PS C:\Reports&gt; dotnet run
   [PowerShell] Wrote sign-ins.svg
   [PowerShell] PS C:\Reports&gt; 

3. Read the result
   Language: csharp
   var chart = Chart.Create()
       .WithTitle("Sign-ins by method")
       .AddStackedArea("Passkey", passkey)
       .AddStackedArea("Password", password);
   chart.SaveSvg("sign-ins.svg");
   Sign-ins by method, passkey sign-ins rising

