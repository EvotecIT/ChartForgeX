<title id="cfx-story-d14d67cd-title">Create a chart in five lines</title>
<desc id="cfx-story-d14d67cd-desc">Create a chart in five lines
Source, execution transcript, and the generated chart stay together.

1. Start with five lines
   C# source
   Language: csharp
   using Chart = ChartForgeX.Core.Chart;
   using ChartPoint = ChartForgeX.Primitives.ChartPoint;
   var chart = Chart.Create().WithTitle("Weekly builds").WithSubtitle("A real outcome, not a console promise").WithTheme(ChartForgeX.Themes.ChartTheme.ReportDark()).WithSize(900, 500).WithXLabels("Mon", "Tue", "Wed", "Thu", "Fri");
   chart.AddSmoothArea("Builds", new[] { new ChartPoint(1, 12), new ChartPoint(2, 18), new ChartPoint(3, 15), new ChartPoint(4, 24), new ChartPoint(5, 31) });
   ChartForgeX.ChartExtensions.SavePng(chart, "weekly-builds.png");
   

2. Run the example
   C# source
