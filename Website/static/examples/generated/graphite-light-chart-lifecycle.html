<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measurements that keep their identity</title>
<style>:root {
  color-scheme: light dark;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--cfx-host-background, var(--hfx-color-surface-page));
  color: var(--cfx-tooltip-text, var(--hfx-color-text));
  font-family: var(--cfx-tooltip-font, var(--hfx-font-sans));
}

.cfx-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

.cfx-shell > * {
  min-width: 0;
  max-width: 100%;
}

.cfx-dashboard {
  width: min(100%, 1440px);
  display: grid;
  grid-template-columns: repeat(var(--cfx-dashboard-columns, 2), minmax(0, 1fr));
  gap: 18px;
}

.cfx-interactive-chart {
  /* Chrome roles: remap control geometry onto host tokens here, in one place. */
  --cfx-tooltip-radius: 8px;
  --cfx-control-radius: 6px;
  --cfx-chip-radius: 999px;
  --cfx-swatch-radius: 2px;
  --cfx-axis-label-radius: 4px;
  --cfx-toolbar-control-size: 28px;
  --cfx-toolbar-control-size-coarse: 36px;
  --cfx-toolbar-icon-size: 16px;
  --cfx-toolbar-inset: 8px;
  --cfx-focus-ring: var(--cfx-host-accent, var(--hfx-color-focus-ring, var(--cfx-default-host-accent)));
  container: cfx-chart / inline-size;
  contain-intrinsic-inline-size: var(--cfx-intrinsic-width, 640px);
  position: relative;
  width: min(100%, 1200px);
  min-width: 0;
  max-width: 100%;
}

.cfx-dashboard .cfx-interactive-chart {
  width: 100%;
}

.cfx-stage {
  position: relative;
  background: var(--cfx-tooltip-surface);
  border: 1px solid var(--cfx-tooltip-line);
  border-radius: var(--cfx-tooltip-radius);
  padding: 12px;
  overflow: hidden;
  touch-action: auto;
}

.cfx-stage svg {
  margin: auto;
  transform: translate(var(--cfx-pan-x, 0), var(--cfx-pan-y, 0)) scale(var(--cfx-zoom, 1));
  transform-origin: center center;
  transition: transform .12s ease;
  will-change: transform;
}
.cfx-interactive-chart[data-cfx-standalone-projection="true"] .cfx-stage svg {
  transform: none;
  transition: none;
  will-change: auto;
}

.cfx-interactive-chart[data-cfx-responsive-layout="fit"] .cfx-stage svg,
.cfx-interactive-chart[data-cfx-responsive-layout="adaptive"] .cfx-stage svg {
  width: 100%;
  max-width: 100%;
  height: auto;
}

/* Readable sizing follows the chart's host, including narrow columns in a wide window. */
.cfx-interactive-chart[data-cfx-responsive-layout="readable"] .cfx-stage {
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-inline: contain;
  touch-action: auto;
}

.cfx-interactive-chart[data-cfx-mode="pan"] .cfx-stage,
.cfx-interactive-chart[data-cfx-mode="brush"] .cfx-stage {
  touch-action: none;
}

.cfx-interactive-chart[data-cfx-responsive-layout="readable"] .cfx-stage svg {
  width: 100%;
  min-width: min(var(--cfx-native-width, 640px), 38rem);
  max-width: none;
}

.cfx-toolbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  margin: 0 0 10px;
}

.cfx-interactive-chart .cfx-toolbar {
  position: absolute;
  inset: var(--cfx-toolbar-inset) auto auto;
  inset-inline-end: var(--cfx-toolbar-inset);
  z-index: 15;
  gap: 2px;
  max-width: calc(100% - 16px);
  margin: 0;
  padding: 2px;
  border: 1px solid var(--cfx-tooltip-line);
  border-radius: var(--cfx-tooltip-radius);
  background: var(--cfx-tooltip-surface);
  box-shadow: var(--cfx-tooltip-shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity 120ms ease-out;
}

.cfx-interactive-chart[data-cfx-toolbar="compact"]:not([data-cfx-responsive-layout="fit"]):not([data-cfx-responsive-layout="adaptive"]) {
  width: min(100%, var(--cfx-native-width, var(--cfx-intrinsic-width)));
}

.cfx-interactive-chart[data-cfx-toolbar="band"] .cfx-toolbar {
  position: static; inset: auto; width: 100%; max-width: 100%;
  gap: 8px; margin: 8px auto 0; padding: 0; border: 0; box-shadow: none;
  opacity: 1; pointer-events: auto;
}
.cfx-interactive-chart[data-cfx-toolbar="band"]:not([data-cfx-responsive-layout="fit"]) .cfx-toolbar {
  max-width: var(--cfx-native-width);
}

.cfx-interactive-chart[data-cfx-toolbar="compact"] .cfx-toolbar {
  gap: 2px;
}

.cfx-interactive-chart[data-cfx-toolbar="compact"] .cfx-toolbar .cfx-tool {
  flex: 0 0 auto;
  border-color: transparent;
  color: var(--cfx-tooltip-muted);
}

.cfx-frame {
  position: relative;
  min-width: 0;
}

.cfx-interactive-chart[tabindex="-1"]:focus {
  outline: none;
}

/* Reserved control rows keep the plot still when selection and reset appear. */
.cfx-reset {
  z-index: 15;
  display: flex;
  width: max-content;
  margin: 8px 8px 0 auto;
  align-items: center;
  min-height: 32px;
  padding: 0 10px;
  border: 1px solid var(--cfx-tooltip-line);
  border-radius: var(--cfx-control-radius);
  background: var(--cfx-tooltip-surface);
  color: var(--cfx-tooltip-text);
  cursor: pointer;
  font: 600 12px/1 var(--cfx-tooltip-font);
  white-space: nowrap;
  transition: opacity 120ms ease-out;
}

.cfx-reset[hidden] {
  display: flex;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
}

.cfx-reset:hover,
.cfx-reset:focus-visible {
  border-color: var(--cfx-default-host-accent);
  color: var(--cfx-default-host-accent);
}

.cfx-scenarios {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 10px;
}

.cfx-tool,
.cfx-scenario {
  border: 1px solid var(--cfx-tooltip-line);
  border-radius: var(--cfx-control-radius);
  background: var(--cfx-tooltip-surface);
  color: var(--cfx-tooltip-text);
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 9px;
}

.cfx-scenario {
  border-color: color-mix(in srgb, var(--cfx-scenario-color, var(--cfx-tooltip-muted)) 45%, var(--cfx-tooltip-line));
}

.cfx-scenario::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 7px;
  border-radius: var(--cfx-chip-radius, var(--hfx-radius-pill));
  background: var(--cfx-scenario-color, var(--cfx-tooltip-muted));
}

.cfx-tool:hover,
.cfx-tool:focus-visible,
.cfx-tool[aria-pressed="true"],
.cfx-scenario:hover,
.cfx-scenario:focus-visible,
.cfx-scenario[aria-pressed="true"] {
  border-color: var(--cfx-default-host-accent);
  color: var(--cfx-default-host-accent);
}

.cfx-scenario-panel {
  display: grid;
  gap: 8px;
  margin: 0 0 10px;
  padding: 10px 12px;
  border: 1px solid var(--cfx-tooltip-line);
  border-radius: var(--cfx-tooltip-radius);
  background: var(--cfx-tooltip-surface);
  color: var(--cfx-tooltip-text);
}

.cfx-scenario-panel__summary {
  display: grid;
  gap: 2px;
}

.cfx-scenario-panel__title {
  color: var(--cfx-scenario-color, var(--cfx-tooltip-text));
  font-size: 14px;
  font-weight: 600;
}

.cfx-scenario-panel__meta {
  color: var(--cfx-tooltip-muted);
  font-size: 12px;
}

.cfx-scenario-panel__controls,
.cfx-scenario-panel__steps {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0;
  padding: 0;
}

.cfx-scenario-panel__steps {
  list-style: none;
}

.cfx-scenario-panel__steps li {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  padding: 3px 8px;
  border: 1px solid var(--cfx-tooltip-line);
  border-radius: var(--cfx-control-radius);
  background: var(--cfx-tooltip-surface);
  color: var(--cfx-tooltip-text);
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
}

.cfx-scenario-panel__steps li::before {
  content: attr(data-cfx-scenario-step-index);
  display: inline-grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: var(--cfx-chip-radius, var(--hfx-radius-pill));
  background: var(--cfx-scenario-color, var(--cfx-default-host-accent));
  color: var(--cfx-tooltip-surface);
  font-size: 10px;
}

.cfx-scenario-panel__steps li[aria-current="step"] {
  border-color: var(--cfx-scenario-color, var(--cfx-default-host-accent));
  color: var(--cfx-tooltip-text);
}

.cfx-interactive-chart[data-cfx-scenario-playback="playing"] [data-cfx-scenario-step-control="play"] {
  border-color: var(--cfx-scenario-color, var(--cfx-default-host-accent));
  background: color-mix(in srgb, var(--cfx-scenario-color, var(--cfx-default-host-accent)) 30%, var(--cfx-tooltip-surface));
  color: var(--cfx-tooltip-surface);
}

.cfx-scenario-progress {
  position: relative;
  min-height: 24px;
  overflow: hidden;
  border: 1px solid var(--cfx-tooltip-line);
  border-radius: var(--cfx-chip-radius, var(--hfx-radius-pill));
  background: var(--cfx-tooltip-surface);
  color: var(--cfx-tooltip-text);
}

.cfx-scenario-progress[hidden] {
  display: none;
}

.cfx-scenario-progress__bar {
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--cfx-scenario-progress, 0%);
  border-radius: inherit;
  background: color-mix(in srgb, var(--cfx-scenario-color, var(--cfx-default-host-accent)) 46%, var(--cfx-default-host-accent));
  transition: width .18s ease;
}

.cfx-scenario-progress__text {
  position: relative;
  z-index: 1;
  display: block;
  overflow: hidden;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cfx-scenario-scrubber {
  width: 100%;
  min-height: 24px;
  margin: 0;
  accent-color: var(--cfx-scenario-color, var(--cfx-default-host-accent));
  cursor: pointer;
}

.cfx-scenario-scrubber:disabled {
  cursor: default;
  opacity: .45;
}

.cfx-tooltip {
  position: fixed;
  z-index: 20;
  box-sizing: border-box;
  min-width: min(160px, calc(100vw - 16px));
  max-width: min(320px, calc(100vw - 16px));
  border: 1px solid var(--cfx-tooltip-line);
  border-radius: var(--cfx-tooltip-radius);
  background: var(--cfx-tooltip-surface);
  box-shadow: var(--cfx-tooltip-shadow);
  color: var(--cfx-tooltip-text);
  font: 400 12px/18px var(--cfx-tooltip-font);
  padding: 10px 12px;
  overflow-wrap: anywhere;
  pointer-events: none;
  opacity: 1;
  translate: 0 0;
  transition: opacity 120ms ease-out, translate 120ms ease-out, display 80ms allow-discrete;
}

.cfx-tooltip--pinned {
  border-inline-start: 2px solid var(--cfx-host-accent, var(--cfx-default-host-accent));
  padding-inline-end: 28px;
  pointer-events: auto;
}

.cfx-tooltip--pinned::before {
  content: none;
}

.cfx-tooltip__title {
  margin: 0 0 6px;
  color: var(--cfx-tooltip-muted);
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
  overflow-wrap: anywhere;
}

.cfx-tooltip__secondary {
  margin-top: 6px;
  color: var(--cfx-tooltip-muted);
  font-size: 11px;
  line-height: 16px;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.cfx-tooltip__title--series {
  display: flex;
  align-items: center;
  gap: 8px;
}

.cfx-tooltip__swatch {
  display: inline-block;
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: var(--cfx-swatch-radius, var(--hfx-radius-2xs));
  background: var(--cfx-series-color, currentColor);
}

.cfx-tooltip__meta {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 2px 16px;
  margin: 0;
  color: var(--cfx-tooltip-text);
}

.cfx-tooltip__meta dt,
.cfx-tooltip__meta dd {
  text-align: end;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.cfx-tooltip__meta dt {
  display: flex;
  align-items: center;
  gap: 8px;
  color: inherit;
  font-weight: 400;
}

.cfx-tooltip__meta dd {
  overflow-wrap: anywhere;
}

.cfx-tooltip[hidden] {
  display: none;
  opacity: 0;
  translate: 0 2px;
  transition-duration: 80ms;
  transition-delay: 60ms;
}

@starting-style {
  .cfx-tooltip:not([hidden]) { opacity: 0; translate: 0 2px; }
}

.cfx-brush-box {
  position: absolute;
  z-index: 10;
  border: 1px solid var(--cfx-default-host-accent);
  background: var(--cfx-default-host-accent);
  pointer-events: none;
}

.cfx-brush-box[hidden] {
  display: none;
}

.cfx-crosshair {
  position: absolute;
  overflow: visible;
  z-index: 9;
  pointer-events: none;
}

.cfx-crosshair[hidden] {
  display: none;
}

.cfx-crosshair__line {
  position: absolute;
  box-sizing: border-box;
  background: none;
  box-shadow: none;
  opacity: .5;
}

/* Crosshair lines end at the plot; value labels remain outside those edges. */
.cfx-crosshair__line--x {
  left: 0;
  right: 0;
  top: var(--cfx-crosshair-y, 0);
  height: 1px;
  transform: translateY(-50%);
}

.cfx-crosshair__line--y {
  top: 0;
  bottom: 0;
  left: var(--cfx-crosshair-x, 0);
  width: 1px;
  transform: translateX(-50%);
}

.cfx-crosshair__label {
  position: absolute;
  box-sizing: border-box;
  width: max-content;
  max-width: min(210px, calc(100vw - 16px));
  overflow: hidden;
  border: 1px solid var(--cfx-tooltip-line);
  border-radius: var(--cfx-control-radius);
  background: var(--cfx-crosshair-label-surface, var(--cfx-tooltip-text));
  color: var(--cfx-crosshair-label-text, var(--cfx-tooltip-surface));
  font: 600 11px/16px var(--cfx-tooltip-font);
  padding: 2px 6px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cfx-reveal-layer {
  position: absolute;
  inset: 0;
  z-index: 12;
  overflow: hidden;
  pointer-events: none;
}

.cfx-reveal-layer[hidden] {
  display: none;
}

.cfx-reveal-label {
  position: absolute;
  max-width: min(220px, calc(100% - 16px));
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--cfx-scenario-color, var(--cfx-default-host-accent)) 42%, var(--cfx-tooltip-surface));
  border-radius: var(--cfx-chip-radius, var(--hfx-radius-pill));
  background: color-mix(in srgb, var(--cfx-scenario-color, var(--cfx-default-host-accent)) 18%, var(--cfx-tooltip-surface));
  box-shadow: var(--cfx-tooltip-shadow);
  color: var(--cfx-tooltip-text);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.15;
  padding: 5px 8px;
  text-overflow: ellipsis;
  transform: translateX(-50%);
  white-space: nowrap;
}

.cfx-reveal-label::before {
  content: attr(data-cfx-reveal-index);
  display: inline-grid;
  place-items: center;
  width: 16px;
  height: 16px;
  margin-right: 5px;
  border-radius: var(--cfx-chip-radius, var(--hfx-radius-pill));
  background: color-mix(in srgb, var(--cfx-tooltip-text) 6%, transparent);
  color: var(--cfx-tooltip-text);
  font-size: 10px;
}

.cfx-compare-tray {
  position: relative;
  z-index: 14;
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 6px;
  width: 100%;
  max-width: 100%;
  margin-top: 8px;
  min-height: 46px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
  contain: inline-size;
  border: 1px solid var(--cfx-tooltip-line);
  border-radius: var(--cfx-tooltip-radius);
  background: var(--cfx-tooltip-surface);
  box-shadow: var(--cfx-tooltip-shadow);
  color: var(--cfx-tooltip-text);
  padding: 6px;
  pointer-events: auto;
}

.cfx-compare-tray[hidden] {
  display: flex;
  visibility: hidden;
}

.cfx-compare-tray__summary,
.cfx-compare-tray__range {
  flex: 0 0 auto;
  color: var(--cfx-default-host-accent);
  font-size: 11px;
  font-weight: 600;
  padding: 0 5px;
  white-space: nowrap;
}

.cfx-compare-chip,
.cfx-compare-page,
.cfx-compare-clear {
  min-width: 0;
  border: 1px solid var(--cfx-tooltip-line);
  border-radius: var(--cfx-chip-radius, var(--hfx-radius-pill));
  background: var(--cfx-tooltip-surface);
  color: var(--cfx-tooltip-text);
  cursor: pointer;
  font: inherit;
  font-size: 11px;
  font-weight: 600;
  line-height: 1;
  padding: 6px 8px;
}

.cfx-compare-chip {
  flex: 0 0 auto;
  max-width: min(220px, 75%);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cfx-compare-chip:hover,
.cfx-compare-chip:focus-visible,
.cfx-compare-page:hover:not(:disabled),
.cfx-compare-page:focus-visible {
  border-color: var(--cfx-default-host-accent);
  color: var(--cfx-tooltip-text);
}

.cfx-compare-page { flex: 0 0 auto; white-space: nowrap; }
.cfx-compare-page:disabled { cursor: default; opacity: .5; }

.cfx-compare-clear {
  flex: 0 0 auto;
  margin-left: auto;
  border-color: var(--cfx-default-host-accent);
  color: var(--cfx-tooltip-text);
}

.cfx-interactive-chart[data-cfx-mode="pan"] .cfx-stage {
  cursor: grab;
}

.cfx-interactive-chart[data-cfx-mode="pan"] .cfx-stage:active {
  cursor: grabbing;
}

.cfx-interactive-chart[data-cfx-mode="brush"] .cfx-stage {
  cursor: crosshair;
}

.cfx-interactive-chart [data-cfx-label],
.cfx-interactive-chart [data-cfx-point],
.cfx-interactive-chart [data-cfx-series],
.cfx-interactive-chart [data-cfx-role="legend-item"],
.cfx-interactive-chart .cfx-interactive-region {
  cursor: pointer;
}
.cfx-interactive-chart .cfx-selected:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-selected[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  filter: none;
  opacity: 1;
  stroke-width: var(--cfx-interactive-focus-stroke-width, 2.4) !important;
}

.cfx-interactive-chart .cfx-hovered:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]):not(:where([data-cfx-hover-mode="root-branch"])) .cfx-hovered[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: 1;
  filter: none;
  stroke-width: var(--cfx-interactive-hover-stroke-width, 1.5) !important;
}

.cfx-interactive-chart:not([data-cfx-look="graphite"]) .cfx-hover-related:not(:where([data-cfx-highlight-managed],.cfx-selected,.cfx-highlighted)),
.cfx-interactive-chart:not([data-cfx-highlight-probe]):not(:where([data-cfx-hover-mode="root-branch"])):not([data-cfx-look="graphite"]) .cfx-hover-related:not(:where(.cfx-selected,.cfx-highlighted))[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .82 !important;
  filter: none;
}

.cfx-interactive-chart:not([data-cfx-hover-continuous]):not([data-cfx-look="graphite"]):not(:where([data-cfx-hover-mode="root-branch"]))[data-cfx-hovering="true"] [data-cfx-series]:not(.cfx-hovered):not(.cfx-hover-related):not(.cfx-selected):not(:where([data-cfx-highlight-managed],.cfx-highlighted)),
.cfx-interactive-chart:not([data-cfx-hover-continuous]):not([data-cfx-highlight-probe]):not(:where([data-cfx-hover-mode="root-branch"])):not([data-cfx-look="graphite"])[data-cfx-hovering="true"] [data-cfx-series]:not(.cfx-hovered):not(.cfx-hover-related):not(.cfx-selected):not(:where(.cfx-highlighted))[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .4;
}

.cfx-interactive-chart .cfx-trail:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: 1;
  filter: none;
}

.cfx-interactive-chart .cfx-trail[data-cfx-trail-index="1"]:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-trail-index="1"][data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  filter: none;
  stroke-width: var(--cfx-interactive-trail-stroke-width, 2.6) !important;
}

.cfx-interactive-chart .cfx-trail[data-cfx-trail-index="2"]:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-trail-index="2"][data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
