<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check results over time</title>
<style>:root {
  color-scheme: light dark;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f172a;
  color: #e5e7eb;
  font-family: Inter, ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif;
}

.cfx-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

.cfx-dashboard {
  width: min(100%, 1440px);
  display: grid;
  grid-template-columns: repeat(var(--cfx-dashboard-columns, 2), minmax(0, 1fr));
  gap: 18px;
}

.cfx-interactive-chart {
  position: relative;
  width: min(100%, 1200px);
  min-width: 0;
  max-width: 100%;
}

.cfx-dashboard .cfx-interactive-chart {
  width: 100%;
}

.cfx-stage {
  position: relative;
  background: #020617;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 12px;
  overflow: hidden;
  touch-action: none;
}

.cfx-stage svg {
  margin: auto;
  transform: translate(var(--cfx-pan-x, 0), var(--cfx-pan-y, 0)) scale(var(--cfx-zoom, 1));
  transform-origin: center center;
  transition: transform .12s ease;
  will-change: transform;
}

.cfx-interactive-chart[data-cfx-responsive-layout="fit"] .cfx-stage svg {
  width: 100%;
  max-width: 100%;
  height: auto;
}

/* Readable sizing follows the chart's host, including narrow columns in a wide window. */
.cfx-interactive-chart[data-cfx-responsive-layout="readable"] .cfx-stage {
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  scrollbar-gutter: stable;
  touch-action: auto;
}

.cfx-interactive-chart[data-cfx-responsive-layout="readable"][data-cfx-mode="pan"] .cfx-stage,
.cfx-interactive-chart[data-cfx-responsive-layout="readable"][data-cfx-mode="brush"] .cfx-stage {
  touch-action: none;
}

.cfx-interactive-chart[data-cfx-responsive-layout="readable"] .cfx-stage svg {
  width: 100%;
  min-width: min(var(--cfx-native-width, 640px), 38rem);
  max-width: none;
}

.cfx-toolbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  margin: 0 0 10px;
  padding: 6px;
  border: 1px solid rgba(51, 65, 85, .72);
  border-radius: 10px;
  background: rgba(15, 23, 42, .58);
}

.cfx-frame {
  position: relative;
  min-width: 0;
}

.cfx-interactive-chart[tabindex="-1"]:focus {
  outline: none;
}

/* Contextual reset clears chart content and appears below the stage only after the view changes. */
.cfx-reset {
  display: flex;
  width: max-content;
  margin: 8px 8px 0 auto;
  align-items: center;
  height: 28px;
  padding: 0 10px;
  border: 1px solid rgba(148, 163, 184, .45);
  border-radius: 6px;
  background: rgba(15, 23, 42, .78);
  color: #e5e7eb;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
}

.cfx-reset[hidden] {
  display: none;
}

.cfx-reset:hover,
.cfx-reset:focus-visible {
  border-color: #38bdf8;
  color: #7dd3fc;
}

.cfx-scenarios {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 10px;
}

.cfx-tool,
.cfx-scenario {
  border: 1px solid #334155;
  border-radius: 6px;
  background: #111827;
  color: #e5e7eb;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  font-weight: 800;
  padding: 6px 9px;
}

.cfx-scenario {
  border-color: color-mix(in srgb, var(--cfx-scenario-color, #64748b) 45%, #334155);
}

.cfx-scenario::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 7px;
  border-radius: 999px;
  background: var(--cfx-scenario-color, #64748b);
}

.cfx-tool:hover,
.cfx-tool:focus-visible,
.cfx-tool[aria-pressed="true"],
.cfx-scenario:hover,
.cfx-scenario:focus-visible,
.cfx-scenario[aria-pressed="true"] {
  border-color: #38bdf8;
  color: #7dd3fc;
}

.cfx-scenario-panel {
  display: grid;
  gap: 8px;
  margin: 0 0 10px;
  padding: 10px 12px;
  border: 1px solid rgba(51, 65, 85, .95);
  border-radius: 8px;
  background: rgba(15, 23, 42, .78);
  color: #e5e7eb;
}

.cfx-scenario-panel__summary {
  display: grid;
  gap: 2px;
}

.cfx-scenario-panel__title {
  color: var(--cfx-scenario-color, #f8fafc);
  font-size: 14px;
  font-weight: 800;
}

.cfx-scenario-panel__meta {
  color: #94a3b8;
  font-size: 12px;
}

.cfx-scenario-panel__controls,
.cfx-scenario-panel__steps {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0;
  padding: 0;
}

.cfx-scenario-panel__steps {
  list-style: none;
}

.cfx-scenario-panel__steps li {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  padding: 3px 8px;
  border: 1px solid rgba(51, 65, 85, .95);
  border-radius: 6px;
  background: rgba(2, 6, 23, .52);
  color: #cbd5e1;
  cursor: pointer;
  font-size: 11px;
  font-weight: 800;
}

.cfx-scenario-panel__steps li::before {
  content: attr(data-cfx-scenario-step-index);
  display: inline-grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 999px;
  background: var(--cfx-scenario-color, #2563eb);
  color: #fff;
  font-size: 10px;
}

.cfx-scenario-panel__steps li[aria-current="step"] {
  border-color: var(--cfx-scenario-color, #38bdf8);
  color: #f8fafc;
}

.cfx-interactive-chart[data-cfx-scenario-playback="playing"] [data-cfx-scenario-step-control="play"] {
  border-color: var(--cfx-scenario-color, #38bdf8);
  background: color-mix(in srgb, var(--cfx-scenario-color, #38bdf8) 30%, rgba(15, 23, 42, .92));
  color: #fff;
}

.cfx-scenario-progress {
  position: relative;
  min-height: 24px;
  overflow: hidden;
  border: 1px solid rgba(51, 65, 85, .95);
  border-radius: 999px;
  background: rgba(2, 6, 23, .54);
  color: #dbeafe;
}

.cfx-scenario-progress[hidden] {
  display: none;
}

.cfx-scenario-progress__bar {
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--cfx-scenario-progress, 0%);
  border-radius: inherit;
  background: color-mix(in srgb, var(--cfx-scenario-color, #38bdf8) 46%, rgba(56, 189, 248, .2));
  transition: width .18s ease;
}

.cfx-scenario-progress__text {
  position: relative;
  z-index: 1;
  display: block;
  overflow: hidden;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 900;
  line-height: 1.2;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cfx-scenario-scrubber {
  width: 100%;
  min-height: 24px;
  margin: 0;
  accent-color: var(--cfx-scenario-color, #38bdf8);
  cursor: pointer;
}

.cfx-scenario-scrubber:disabled {
  cursor: default;
  opacity: .45;
}

.cfx-tooltip {
  position: fixed;
  z-index: 20;
  min-width: 180px;
  max-width: 320px;
  border: 1px solid rgba(56, 189, 248, .45);
  border-radius: 7px;
  background: rgba(15, 23, 42, .96);
  box-shadow: 0 12px 28px rgba(0, 0, 0, .26);
  color: #f8fafc;
  font-size: 12px;
  line-height: 1.35;
  padding: 8px 10px;
  pointer-events: none;
}

.cfx-tooltip--pinned {
  border-color: rgba(250, 204, 21, .7);
  box-shadow: 0 14px 32px rgba(0, 0, 0, .30), 0 0 0 1px rgba(250, 204, 21, .16) inset;
}

.cfx-tooltip--pinned::before {
  content: "Pinned";
  display: block;
  margin-bottom: 4px;
  color: #fde68a;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .04em;
  text-transform: uppercase;
}

.cfx-tooltip__title {
  font-weight: 800;
  overflow-wrap: anywhere;
}

.cfx-tooltip__secondary {
  margin-top: 4px;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.cfx-tooltip__title--series {
  display: flex;
  align-items: center;
  gap: 6px;
}

.cfx-tooltip__swatch {
  display: inline-block;
  width: 10px;
  height: 10px;
  flex: 0 0 10px;
  border-radius: 2px;
}

.cfx-tooltip__meta {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 2px 10px;
  margin: 6px 0 0;
  color: #cbd5e1;
}

.cfx-tooltip__meta dt,
.cfx-tooltip__meta dd {
  margin: 0;
  min-width: 0;
}

.cfx-tooltip__meta dt {
  color: #94a3b8;
  font-weight: 700;
}

.cfx-tooltip__meta dd {
  overflow-wrap: anywhere;
}

.cfx-tooltip[hidden] {
  display: none;
}

.cfx-brush-box {
  position: absolute;
  z-index: 10;
  border: 1px solid rgba(56, 189, 248, .95);
  background: rgba(56, 189, 248, .18);
  pointer-events: none;
}

.cfx-brush-box[hidden] {
  display: none;
}

.cfx-crosshair {
  position: absolute;
  overflow: hidden;
  z-index: 9;
  pointer-events: none;
}

.cfx-crosshair[hidden] {
  display: none;
}

.cfx-crosshair__line {
  position: absolute;
  box-sizing: border-box;
  background: rgba(14, 165, 233, .58);
  box-shadow: 0 0 10px rgba(14, 165, 233, .18);
}

/* Center background and border strokes so clipping retains ink at either plot edge. */
.cfx-crosshair__line--x {
  left: 0;
  right: 0;
  top: var(--cfx-crosshair-y, 0);
  height: 1px;
  transform: translateY(-50%);
}

.cfx-crosshair__line--y {
  top: 0;
  bottom: 0;
  left: var(--cfx-crosshair-x, 0);
  width: 1px;
  transform: translateX(-50%);
}

.cfx-crosshair__label {
  position: absolute;
  left: 0;
  top: 0;
  box-sizing: border-box;
  width: max-content;
  max-width: min(210px, 100%);
  max-height: 100%;
  overflow: hidden;
  border: 1px solid rgba(14, 165, 233, .42);
  border-radius: 999px;
  background: rgba(15, 23, 42, .86);
  color: #e0f2fe;
  font-size: 11px;
  font-weight: 800;
  padding: 4px 8px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cfx-reveal-layer {
  position: absolute;
  inset: 0;
  z-index: 12;
  overflow: hidden;
  pointer-events: none;
}

.cfx-reveal-layer[hidden] {
  display: none;
}

.cfx-reveal-label {
  position: absolute;
  max-width: min(220px, calc(100% - 16px));
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--cfx-scenario-color, #38bdf8) 42%, rgba(15, 23, 42, .7));
  border-radius: 999px;
  background: color-mix(in srgb, var(--cfx-scenario-color, #38bdf8) 18%, rgba(2, 6, 23, .9));
  box-shadow: 0 10px 24px rgba(2, 6, 23, .28);
  color: #f8fafc;
  font-size: 11px;
  font-weight: 900;
  line-height: 1.15;
  padding: 5px 8px;
  text-overflow: ellipsis;
  transform: translateX(-50%);
  white-space: nowrap;
}

.cfx-reveal-label::before {
  content: attr(data-cfx-reveal-index);
  display: inline-grid;
  place-items: center;
  width: 16px;
  height: 16px;
  margin-right: 5px;
  border-radius: 999px;
  background: rgba(248, 250, 252, .16);
  color: #bae6fd;
  font-size: 10px;
}

.cfx-compare-tray {
  position: relative;
  z-index: 11;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  width: 100%;
  max-width: 100%;
  margin-top: 8px;
  contain: inline-size;
  border: 1px solid rgba(56, 189, 248, .36);
  border-radius: 8px;
  background: rgba(2, 6, 23, .82);
  box-shadow: 0 12px 28px rgba(0, 0, 0, .24);
  color: #e0f2fe;
  padding: 6px;
  pointer-events: auto;
}

.cfx-compare-tray[hidden] {
  display: none;
}

.cfx-compare-tray__summary,
.cfx-compare-tray__more {
  flex: 0 0 auto;
  color: #7dd3fc;
  font-size: 11px;
  font-weight: 900;
  padding: 0 5px;
  white-space: nowrap;
}

.cfx-compare-chip,
.cfx-compare-clear {
  min-width: 0;
  border: 1px solid rgba(56, 189, 248, .34);
  border-radius: 999px;
  background: rgba(15, 23, 42, .72);
  color: #f8fafc;
  cursor: pointer;
  font: inherit;
  font-size: 11px;
  font-weight: 800;
  line-height: 1;
  padding: 6px 8px;
}

.cfx-compare-chip {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cfx-compare-chip:hover,
.cfx-compare-chip:focus-visible {
  border-color: #7dd3fc;
  color: #bae6fd;
}

.cfx-compare-clear {
  flex: 0 0 auto;
  margin-left: auto;
  border-color: rgba(250, 204, 21, .44);
  color: #fde68a;
}

.cfx-interactive-chart[data-cfx-mode="pan"] .cfx-stage {
  cursor: grab;
}

.cfx-interactive-chart[data-cfx-mode="pan"] .cfx-stage:active {
  cursor: grabbing;
}

.cfx-interactive-chart[data-cfx-mode="brush"] .cfx-stage {
  cursor: crosshair;
}

.cfx-interactive-chart [data-cfx-label],
.cfx-interactive-chart [data-cfx-point],
.cfx-interactive-chart [data-cfx-series],
.cfx-interactive-chart [data-cfx-role="legend-item"],
.cfx-interactive-chart .cfx-interactive-region {
  cursor: pointer;
}
.cfx-interactive-chart .cfx-selected:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-selected[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  filter: drop-shadow(0 0 8px rgba(56, 189, 248, .75));
  opacity: 1 !important;
  stroke-width: var(--cfx-interactive-focus-stroke-width, 2.4) !important;
}

.cfx-interactive-chart .cfx-hovered:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]):not(:where([data-cfx-hover-mode="root-branch"])) .cfx-hovered[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: 1 !important;
  filter: drop-shadow(0 0 10px rgba(125, 211, 252, .72));
  stroke-width: var(--cfx-interactive-hover-stroke-width, 2.5) !important;
}

.cfx-interactive-chart:not([data-cfx-look="graphite"]) .cfx-hover-related:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]):not(:where([data-cfx-hover-mode="root-branch"])):not([data-cfx-look="graphite"]) .cfx-hover-related[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .82 !important;
  filter: drop-shadow(0 0 6px rgba(125, 211, 252, .34));
}

.cfx-interactive-chart:not([data-cfx-look="graphite"]):not(:where([data-cfx-hover-mode="root-branch"]))[data-cfx-hovering="true"] [data-cfx-series]:not(.cfx-hovered):not(.cfx-hover-related):not(.cfx-selected):not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]):not(:where([data-cfx-hover-mode="root-branch"])):not([data-cfx-look="graphite"])[data-cfx-hovering="true"] [data-cfx-series]:not(.cfx-hovered):not(.cfx-hover-related):not(.cfx-selected)[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .38;
}

.cfx-interactive-chart .cfx-trail:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: 1 !important;
  filter: drop-shadow(0 0 9px rgba(34, 211, 238, .44));
}

.cfx-interactive-chart .cfx-trail[data-cfx-trail-index="1"]:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-trail-index="1"][data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  filter: drop-shadow(0 0 12px rgba(250, 204, 21, .72));
  stroke-width: var(--cfx-interactive-trail-stroke-width, 2.6) !important;
}

.cfx-interactive-chart .cfx-trail[data-cfx-trail-index="2"]:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-trail-index="2"][data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .86 !important;
}

.cfx-interactive-chart .cfx-trail[data-cfx-trail-index="3"]:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-trail-index="3"][data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .72 !important;
}

.cfx-interactive-chart .cfx-trail[data-cfx-trail-index="4"]:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart .cfx-trail[data-cfx-trail-index="5"]:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-trail-index="4"][data-cfx-highlight-managed] > [data-cfx-highlight-paint],
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-trail-index="5"][data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .58 !important;
}

.cfx-interactive-chart .cfx-series-muted:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-series-muted[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .18 !important;
}

.cfx-interactive-chart .cfx-series-isolated-in:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-series-isolated-in[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: 1 !important;
  filter: drop-shadow(0 0 10px rgba(250, 204, 21, .34));
}

.cfx-interactive-chart .cfx-series-isolated-out:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-series-isolated-out[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .10 !important;
  filter: saturate(.35);
}

.cfx-interactive-chart [data-cfx-role="legend-item"][data-cfx-isolated="true"] {
  filter: drop-shadow(0 0 8px rgba(250, 204, 21, .55));
}

.cfx-interactive-chart .cfx-scenario-muted:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-scenario-muted[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .46 !important;
  filter: saturate(.72);
}

.cfx-interactive-chart .cfx-scenario-active:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-scenario-active[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: 1 !important;
  filter: drop-shadow(0 0 8px color-mix(in srgb, var(--cfx-scenario-color, #38bdf8) 70%, transparent));
}

.cfx-interactive-chart .cfx-scenario-step-active:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-scenario-step-active[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: 1 !important;
  filter: drop-shadow(0 0 10px color-mix(in srgb, var(--cfx-scenario-color, #38bdf8) 80%, transparent));
}

.cfx-interactive-chart .cfx-scenario-step-muted:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-scenario-step-muted[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .56 !important;
  filter: saturate(.8);
}

@media (max-width: 900px) {
  .cfx-shell {
    padding: 14px;
  }

  .cfx-dashboard {
    grid-template-columns: 1fr !important;
  }

  .cfx-stage {
    padding: 8px;
  }

  .cfx-toolbar,
  .cfx-scenario-panel__controls {
    justify-content: stretch;
  }

  .cfx-toolbar .cfx-tool,
  .cfx-scenario-panel__controls .cfx-tool {
    flex: 1 1 auto;
    min-height: 36px;
  }

  .cfx-scenario-panel__steps {
    display: grid;
    grid-template-columns: 1fr;
  }

  .cfx-scenario-panel__steps li {
    min-height: 34px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .cfx-stage svg,
  .cfx-scenario-progress__bar,
  .cfx-interactive-chart [data-cfx-label],
  .cfx-interactive-chart [data-cfx-point],
  .cfx-interactive-chart [data-cfx-series] {
    transition: none !important;
  }
}

/* Graphite keeps host controls separate from the chart's single frame. */

<script>(() => {
  const featureAliases = {

  const featureTokens = (root) => (root.dataset.cfxInteractionFeatures || '')
    .split(',')
    .map((feature) => feature.trim())
    .filter(Boolean);
  const hasFeature = (root, name) => featureTokens(root).some((feature) => feature.toLowerCase() === name.toLowerCase()
    || (featureAliases[feature] || []).some((alias) => alias.toLowerCase() === name.toLowerCase()));
  const targetSelector = '.cfx-interactive-region,[data-cfx-target-kind],[data-cfx-label],[data-cfx-point],[data-cfx-series],[data-cfx-region],[data-cfx-node],[data-cfx-role="legend-item"]';
  const lassoSelector = '.cfx-interactive-region,[data-cfx-target-kind]:not([data-cfx-target-kind="legend"]),[data-cfx-label],[data-cfx-point],[data-cfx-region],[data-cfx-node]';
  const renderedTargetSelector = '.cfx-interactive-region,[data-cfx-label],[data-cfx-series],[data-cfx-point],[data-cfx-region],[data-cfx-node],[data-cfx-source][data-cfx-target],[data-cfx-role="legend-item"],[data-cfx-role^="annotation"]';
  const isPassiveTarget = (node) => !!node.closest('[data-cfx-passive="true"]');
  const isInteractiveTarget = (node) => {
    if (isPassiveTarget(node)) return false;
    const role = (node.dataset || {}).cfxRole;
    if (role === 'legend-entry-omitted') return false;
    if (role === 'legend-item') return true;
    if (node.closest('[data-cfx-role="legend-item"]')) return false;
    // Bind a semantic group once; a nested group with its own explicit identity remains a target.
    const owner = node.parentElement && node.parentElement.closest('[data-cfx-point],[data-cfx-region],[data-cfx-node],[data-cfx-series][data-cfx-value]:not([data-cfx-point])');
    if (!owner) return true;
    const data = node.dataset || {}, ownerData = owner.dataset || {};
    return !!(data.cfxTargetKind && data.cfxTargetId
      && (data.cfxTargetKind !== ownerData.cfxTargetKind || data.cfxTargetId !== ownerData.cfxTargetId));
  };
  const interactiveTargets = (root, selector = targetSelector) => Array.from(root.querySelectorAll(selector)).filter(isInteractiveTarget);
  const targetFocusNode = (node) => {
    // Only the renderer-owned cell link is a mark's alternate keyboard target.
    const link = node.parentElement;
    if (link && link.matches('a[data-cfx-role="heatmap-cell-link"][href]')) return link;
    // Prepared marks put identity on the outer group and their cell link inside it.
    return Array.from(node.children).find((child) => child.matches('a[data-cfx-role="heatmap-cell-link"][href]')) || node;
  };

  const legendTarget = (node) => {
    const data = node.dataset || {};
    return data.cfxLegendTargetKind && data.cfxLegendTargetId
      ? { targetKind: data.cfxLegendTargetKind, targetId: data.cfxLegendTargetId } : null;
  };
  const referencedTargetNode = (root, target) => Array.from(root.querySelectorAll('[data-cfx-target-kind][data-cfx-target-id]'))
    .find((node) => isInteractiveTarget(node) && (node.dataset || {}).cfxRole !== 'legend-item'
      && node.dataset.cfxTargetKind === target.targetKind && node.dataset.cfxTargetId === target.targetId
      && (!target.seriesKey || seriesKey(node) === target.seriesKey));

    const data = node.dataset || {};

      const legendItems = Array.from(root.querySelectorAll('[data-cfx-role="legend-item"][data-cfx-series]'));
      const sameSeries = (item) => (item.dataset || {}).cfxSeries === data.cfxSeries;
      const itemId = data.cfxTargetKind === 'node' ? data.cfxTargetId : undefined;
      if (itemId !== undefined) return legendItems.find((item) => sameSeries(item)
        && (item.dataset || {}).cfxLegendTargetKind === 'node' && item.dataset.cfxLegendTargetId === itemId)
        || legendItems.find((item) => sameSeries(item) && !legendTarget(item));
      return data.cfxPoint === undefined
        ? legendItems.find((item) => sameSeries(item) && (item.dataset || {}).cfxPoint === undefined) || legendItems.find(sameSeries)
        : legendItems.find((item) => sameSeries(item) && (item.dataset || {}).cfxPoint === data.cfxPoint)

    const mapped = svg && data.cfxSeries !== undefined ? svg.getAttribute('data-cfx-series-name-' + data.cfxSeries) : '';

    if (data.cfxSeries === undefined) return '';

  };
  const seriesKey = (node) => {
    const data = node.dataset || {};
    if (data.cfxSeriesKey) return data.cfxSeriesKey;
    const legend = seriesLegend(node);
    if (legend) return (legend.dataset || {}).cfxSeriesKey || seriesLabel(legend);
    const svg = node.closest('svg');

    const data = node.dataset || {};
    if (hasDerivedPointIdentity(node)) return undefined;
    if (data.cfxSourcePoint !== undefined) return data.cfxSourcePoint;
    if (data.cfxPoint === undefined || data.cfxSeries === undefined) return data.cfxPoint;

    const sourceIndices = svg ? svg.getAttribute('data-cfx-series-source-indices-' + data.cfxSeries) : '';
    if (!sourceIndices) return data.cfxPoint;
    const index = Number(data.cfxPoint);
    const mapped = sourceIndices.split(',')[index];
    return mapped === undefined || mapped === '' ? data.cfxPoint : mapped;

    const derived = data.cfxDerived || 'aggregate';

    if (role === 'legend-item') return 'legend';
    if (role.indexOf('annotation') === 0) return 'annotation';
    if (data.cfxRegion !== undefined) return 'region';
    if (data.cfxNode !== undefined) return 'node';
    if (role.indexOf('link') >= 0 || role.indexOf('connector') >= 0 || role.indexOf('edge') >= 0) return 'link';
    if (data.cfxPoint !== undefined) return 'point';
    if (data.cfxSeries !== undefined) return 'series';

    const label = 'Step ' + current + ' / ' + count;
    if (progress) {
      progress.hidden = !count;
      progress.style.setProperty('--cfx-scenario-progress', percent + '%');
      progress.setAttribute('aria-valuemax', String(count));
      progress.setAttribute('aria-valuenow', String(current));
      progress.setAttribute('aria-valuetext', label);
      const textNode = progress.querySelector('[data-cfx-scenario-progress-text]');
      if (textNode) textNode.textContent = label;
    }
    const scrubber = root.querySelector('[data-cfx-scenario-scrubber]');
    if (scrubber) {
      scrubber.disabled = !count;
      scrubber.max = String(Math.max(1, count));
      scrubber.value = String(Math.max(1, current));
      scrubber.setAttribute('aria-valuetext', label);
    }
    if (count) root.dataset.cfxScenarioProgress = current + '/' + count;
    else root.removeAttribute('data-cfx-scenario-progress');
    return { current, count, percent, label };
  };
  const clearScenarioStep = (root) => {
    const route = scenarioRoute(root, root.dataset.cfxActiveScenario || '');
    root.removeAttribute('data-cfx-active-scenario-step');
    root.querySelectorAll('.cfx-scenario-step-active,.cfx-scenario-step-muted').forEach((node) => node.classList.remove('cfx-scenario-step-active', 'cfx-scenario-step-muted'));
    root.querySelectorAll('[data-cfx-scenario-step-index]').forEach((node) => node.removeAttribute('aria-current'));
    updateScenarioProgress(root, route, null);
  };
  const setScenarioStep = (root, stepIndex, emit, sync) => {
    const route = scenarioRoute(root, root.dataset.cfxActiveScenario || '');
    if (!route || !route.steps.length) return;
    const index = clamp(Number(stepIndex) || 0, 0, route.steps.length - 1);
    const targets = scenarioTargets(root, route, index);
    root.dataset.cfxActiveScenarioStep = String(index);
    root.querySelectorAll('.cfx-scenario-active').forEach((node) => {
      const active = targets.has(node);
      node.classList.toggle('cfx-scenario-step-active', active);
      node.classList.toggle('cfx-scenario-step-muted', !active && route.focusMode === 'spotlight');
    });
    root.querySelectorAll('[data-cfx-scenario-step-index]').forEach((node) => {
      node.getAttribute('data-cfx-scenario-step-index') === String(index + 1) ? node.setAttribute('aria-current', 'step') : node.removeAttribute('aria-current');
    });
    const progress = updateScenarioProgress(root, route, index);
    const trail = Array.from(targets).map((node) => targetIdentity(node)).slice(0, 5);
    if (trail.length && hasFeature(root, 'FocusTrail')) {
      applyFocusTrail(root, trail);
      if (emit !== false) emitHostEvent(root, 'cfxtrail', { target: trail[0], trail, count: trail.length, source: 'scenario-step' });
      if (sync !== false) emitSync(root, { action: 'trail', target: trail[0], trail, count: trail.length, source: 'scenario-step' });
    }
    revealNodes(root, scenarioRevealTargets(route, index, targets), emit, sync, 'scenario-step');
    syncScenarioUrl(root, route.id, index);
    if (emit !== false) emitHostEvent(root, 'cfxscenariostep', { scenarioId: route.id, index, step: route.steps[index], progress });
    if (sync !== false) emitSync(root, { action: 'scenario-step', scenarioId: route.id, index, progress });
  };
  const setScenario = (root, scenarioId, emit, sync) => {
    const route = scenarioRoute(root, scenarioId);
    const previousPlayback = root.dataset.cfxScenarioPlayback || '';
    stopScenarioPlayback(root, 'idle', emit !== false && previousPlayback && previousPlayback !== 'idle');
    clearScenarioStep(root);
    clearReveals(root);
    root.querySelectorAll('.cfx-scenario-active,.cfx-scenario-muted').forEach((node) => node.classList.remove('cfx-scenario-active', 'cfx-scenario-muted'));
    root.querySelectorAll('[data-cfx-scenario]').forEach((button) => button.setAttribute('aria-pressed', (button.dataset.cfxScenario || '') === (route ? route.id : '') ? 'true' : 'false'));
    if (!route) {
      root.removeAttribute('data-cfx-active-scenario');
      renderScenarioPanel(root, null);
      updateScenarioProgress(root, null, null);
      syncScenarioUrl(root, '', '');
      if (emit !== false) emitHostEvent(root, 'cfxscenarioclear', {});
      if (sync !== false) emitSync(root, { action: 'scenario', scenarioId: '' });
      return;
    }
    root.dataset.cfxActiveScenario = route.id;
    if (route.color) root.style.setProperty('--cfx-scenario-color', route.color);
    else root.style.removeProperty('--cfx-scenario-color');
    const targets = scenarioTargets(root, route, null);
    scenarioTargetCandidates(root, route).forEach((node) => {
      const active = targets.has(node);
      node.classList.toggle('cfx-scenario-active', active);
      node.classList.toggle('cfx-scenario-muted', !active && route.focusMode === 'spotlight');
    });
    renderScenarioPanel(root, route);
    updateScenarioProgress(root, route, null);
    syncScenarioUrl(root, route.id, '');
    if (emit !== false) emitHostEvent(root, 'cfxscenario', { scenarioId: route.id, label: route.label, description: route.description, color: route.color, steps: route.steps, metadata: route.metadata });
    if (sync !== false) emitSync(root, { action: 'scenario', scenarioId: route.id });
  };
  const stepScenario = (root, delta) => {
    const route = scenarioRoute(root, root.dataset.cfxActiveScenario || '');
    if (!route || !route.steps.length) return;
    const current = Number(root.dataset.cfxActiveScenarioStep || (delta > 0 ? '-1' : route.steps.length));
    setScenarioStep(root, current + delta, true, true);
  };
  const scenarioPlaybackDelay = (root, route, stepIndex) => {
    const step = route && route.steps && Number.isFinite(Number(stepIndex)) ? route.steps[Number(stepIndex)] : null;
    const delay = Number((step && step.durationMilliseconds) || (route && route.playbackDelayMilliseconds) || root.dataset.cfxScenarioPlaybackDelay || '900');
    return Number.isFinite(delay) && delay >= 200 ? delay : 900;
  };
  const setScenarioPlaybackState = (root, state, route, emit) => {
    const normalized = state || 'idle';
    root.dataset.cfxScenarioPlayback = normalized;
    root.querySelectorAll('[data-cfx-scenario-step-control="play"]').forEach((button) => {
      const playing = normalized === 'playing';
      button.setAttribute('aria-pressed', playing ? 'true' : 'false');
      button.textContent = playing ? (button.dataset.cfxScenarioPauseLabel || 'Pause') : (button.dataset.cfxScenarioPlayLabel || 'Play');
      button.title = playing ? 'Pause scenario' : 'Play scenario';
    });
    if (emit !== false) {
      emitHostEvent(root, 'cfxscenarioplayback', {
        state: normalized,
        scenarioId: route ? route.id : (root.dataset.cfxActiveScenario || ''),
        stepIndex: root.dataset.cfxActiveScenarioStep || '',
        progress: root.dataset.cfxScenarioProgress || '',
        delay: scenarioPlaybackDelay(root, route, root.dataset.cfxActiveScenarioStep)
      });
    }
  };
  const stopScenarioPlayback = (root, state, emit) => {
    if (root._cfxScenarioPlayback) window.clearTimeout(root._cfxScenarioPlayback);
    root._cfxScenarioPlayback = null;
    setScenarioPlaybackState(root, state || 'idle', scenarioRoute(root, root.dataset.cfxActiveScenario || ''), emit);
  };
  const playScenario = (root, emit) => {
    const route = scenarioRoute(root, root.dataset.cfxActiveScenario || '');
    if (!route || !route.steps.length) return;
    if (root._cfxScenarioPlayback) {
      stopScenarioPlayback(root, 'paused', emit);
      return;
    }
    let index = Number(root.dataset.cfxActiveScenarioStep || '-1') + 1;
    if (!Number.isFinite(index) || index >= route.steps.length) index = 0;
    startScenarioPlayback(root, route, index, emit, true);
  };
  const startScenarioPlayback = (root, route, stepIndex, emit, advanceNow) => {
    if (!route || !route.steps.length) return;
    setScenarioPlaybackState(root, 'playing', route, emit);
    let index = Number(stepIndex);
    if (!Number.isFinite(index) || index < 0) index = 0;
    if (index >= route.steps.length && route.loopPlayback) index = 0;
    const advance = () => {
      if (index >= route.steps.length) {
        if (route.loopPlayback) index = 0;
        else {
          stopScenarioPlayback(root, 'finished', emit);
          return;
        }
      }
      const current = index++;
      setScenarioStep(root, current, true, true);
      root._cfxScenarioPlayback = window.setTimeout(advance, scenarioPlaybackDelay(root, route, current));
    };
    if (advanceNow !== false) advance();
    else root._cfxScenarioPlayback = window.setTimeout(advance, scenarioPlaybackDelay(root, route, Number(root.dataset.cfxActiveScenarioStep || '0')));
  };
  const copyScenarioLink = (root) => {
    syncScenarioUrl(root, root.dataset.cfxActiveScenario || '', root.dataset.cfxActiveScenarioStep || '');
    const url = window.location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).catch(() => {});
    emitHostEvent(root, 'cfxscenariolink', { url });
  };
  document.querySelectorAll('.cfx-interactive-chart').forEach((root) => {
    if (root.dataset.cfxRuntimeBound === 'true') return;
    root.dataset.cfxRuntimeBound = 'true';
    const tip = root.querySelector('.cfx-tooltip');
    const stage = root.querySelector('.cfx-stage');
    const brush = root.querySelector('.cfx-brush-box');
    const crosshair = root.querySelector('.cfx-crosshair');
    const compareTray = root.querySelector('[data-cfx-compare-tray]');
    if (!tip) return;
    applyRenderedTargetContract(root);
    prepareRootBranchHighlights(root);
    if (root._cfxBranchHighlights) root.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      event.preventDefault();
      event.stopPropagation();
      clearHover(root, true, true);
      hideCrosshair(root, crosshair);
      hideTip(root, tip, true);
    });
    applyViewport(root, getState(root));
    renderCompare(root);
    if (compareTray) compareTray.addEventListener('pointerdown', (event) => event.stopPropagation());
    if (hasFeature(root, 'StateBookmarks')) {
      root.addEventListener('cfx-capture-state', (event) => {
        const detail = event.detail || {};
        publishInteractionState(root, detail.source || 'host', detail.sync);
      });
      root.addEventListener('cfx-apply-state', (event) => {
        const detail = event.detail || {};
        applyInteractionState(root, detail.snapshot || detail.state || detail, true, detail.sync);
      });
    }
    prepareKeyboardNavigation(root);
    bindStageLayout(root, stage, crosshair);
    const targets = interactiveTargets(root);
    targets.forEach((node) => {
      const focusNode = targetFocusNode(node);
      const labels = pointLabelSurfaces(root, node);
      [node, ...labels].forEach(surface => {
        surface.addEventListener('pointerenter', (event) => {
          if (!pointerTargetPaint(node)) return;
          if (!ownsTooltipPointer(root, event)) hideCrosshair(root, crosshair);
          setHover(root, node, true, true);
          showTip(root, tip, node, event);
        });
        surface.addEventListener('pointermove', (event) => {
          if (ownsTooltipPointer(root, event)) moveTip(tip, event, node);
        });
        surface.addEventListener('pointerleave', (event) => {
          if (!ownsTooltipPointer(root, event)) return;
          clearHover(root, true, true);
          if (!retainPointerTip(root, event)) hideTip(root, tip, false);
        });
      });
      // Preserve native link focus; disabled adapter navigation must not create implicit SVG tab stops.
      if (hasFeature(root, 'KeyboardNavigation') || focusNode.matches('a[href]')) {
        focusNode.addEventListener('focus', (event) => {
          refreshKeyboardNavigation(root, node);
          if (hasFeature(root, 'KeyboardNavigation')) scrollKeyboardTargetIntoView(root, focusNode);
          if (!tooltipReadoutAvailable(node, event)) { clearHover(root, true, true); hideTip(root, tip, false); return; }
          setHover(root, node, true, true);
          showTip(root, tip, node, event);
        });
        focusNode.addEventListener('blur', () => {
          clearHover(root, true, true);
          hideTip(root, tip, false);
        });
      }
      const activateTarget = (event) => {
        event.stopPropagation();
        if (!tooltipReadoutAvailable(node, event)) return;
        if ((node.dataset ? node.dataset.cfxRole : '') === 'legend-item') {
          if (event.shiftKey) toggleSeriesFocus(root, node, true, true);
          else toggleSeries(root, node);
        }
        else {
          toggleSelection(root, node);
          pinTip(root, tip, node, event);
        }
      };
      focusNode.addEventListener('click', activateTarget);
      labels.forEach(label => label.addEventListener('click', activateTarget));
      if (hasFeature(root, 'KeyboardNavigation')) focusNode.addEventListener('keydown', (event) => {
        if (!hasFeature(root, 'KeyboardNavigation') || event.defaultPrevented || event.target !== focusNode) return;
        if ((node.dataset ? node.dataset.cfxRole : '') === 'legend-item' && event.key.toLowerCase() === 'i') {
          event.preventDefault();
          event.stopPropagation();
          toggleSeriesFocus(root, node, true, true);
          return;
        }
        if (focusAdjacentTarget(root, node, event.key)) {
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        if (event.key !== 'Enter' && event.key !== ' ') return;
        // Enter on a link must retain native navigation. Space selects the cell without following the link.
        if (event.key === 'Enter' && focusNode.matches('a[href]')) return;
        event.preventDefault();
        event.stopPropagation();
        // Keep the keyboard event: a synthetic click's finite (0,0) would replace the focused mark's position.
        activateTarget(event);
      });
    });
    root.querySelectorAll('[data-cfx-zoom]').forEach((button) => {
      button.addEventListener('click', () => zoomBy(root, button.dataset.cfxZoom === 'in' ? 1.25 : 0.8));
    });
    root.querySelectorAll('[data-cfx-mode-button]').forEach((button) => {
      button.addEventListener('click', () => setMode(root, button.dataset.cfxModeButton || ''));
    });
    root.querySelectorAll('[data-cfx-export]').forEach((button) => {
      button.addEventListener('click', () => {
        if (button.dataset.cfxExport === 'png') exportPng(root);
        else exportSvg(root);
      });
    });
    root.querySelectorAll('[data-cfx-scenario]').forEach((button) => {
      button.addEventListener('click', () => setScenario(root, button.dataset.cfxScenario || '', true));
    });
    if (hasFeature(root, 'Scenarios')) {
      root.addEventListener('cfx-set-scenario', (event) => {
        const detail = event.detail || {};
        setScenario(root, detail.scenarioId || '', true, true);
      });
      root.addEventListener('cfx-clear-scenario', () => setScenario(root, '', true, true));
    }
    if (hasFeature(root, 'StepPlayback')) {
      root.querySelectorAll('[data-cfx-scenario-step-control]').forEach((button) => {
        button.addEventListener('click', () => {
          const action = button.dataset.cfxScenarioStepControl || '';
          if (action === 'previous') stepScenario(root, -1);
          else if (action === 'next') stepScenario(root, 1);
          else if (action === 'play') playScenario(root);
          else if (action === 'reset') { stopScenarioPlayback(root, 'paused'); clearScenarioStep(root); clearReveals(root); }
          else if (action === 'link') copyScenarioLink(root);
        });
      });
      root.addEventListener('cfx-set-scenario-step', (event) => {
        const detail = event.detail || {};
        if (detail.scenarioId && root.dataset.cfxActiveScenario !== detail.scenarioId) setScenario(root, detail.scenarioId, true, true);
        const index = detail.index !== undefined ? detail.index : detail.stepIndex;
        setScenarioStep(root, index, true, true);
      });
      root.addEventListener('cfx-clear-scenario-step', () => {
        stopScenarioPlayback(root, 'paused');
        clearScenarioStep(root);
        clearReveals(root);
      });
      root.addEventListener('cfx-play-scenario', (event) => {
        const detail = event.detail || {};
        if (detail.scenarioId && root.dataset.cfxActiveScenario !== detail.scenarioId) setScenario(root, detail.scenarioId, true, true);
        playScenario(root);
      });
      root.addEventListener('cfx-pause-scenario', () => stopScenarioPlayback(root, 'paused'));
      const scrubber = root.querySelector('[data-cfx-scenario-scrubber]');
      if (scrubber) scrubber.addEventListener('input', () => {
        stopScenarioPlayback(root, 'paused');
        setScenarioStep(root, Number(scrubber.value) - 1, true, true);
      });
      const stepsList = root.querySelector('[data-cfx-scenario-panel-steps]');
      if (stepsList) {
        const focusStep = (target) => {
          const item = target instanceof Element ? target.closest('[data-cfx-scenario-step-index]') : null;
          if (item && stepsList.contains(item)) setScenarioStep(root, Number(item.getAttribute('data-cfx-scenario-step-index')) - 1, true, true);
        };
        stepsList.addEventListener('click', (event) => focusStep(event.target));
        stepsList.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          focusStep(event.target);
        });
      }
    }
    if (hasFeature(root, 'Scenarios')) {
      const initialScenario = scenarioUrlParam(root, 'scenario') || root.dataset.cfxActiveScenario || '';
      const initialScenarioStep = scenarioUrlParam(root, 'scenarioStep');
      setScenario(root, initialScenario, false, false);
      if (hasFeature(root, 'StepPlayback') && initialScenarioStep) setScenarioStep(root, initialScenarioStep, false, false);
      const initialRoute = scenarioRoute(root, root.dataset.cfxActiveScenario || '');
      const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (hasFeature(root, 'StepPlayback') && initialRoute && initialRoute.autoPlay && !initialScenarioStep && !reducedMotion) startScenarioPlayback(root, initialRoute, 0, false, true);
    }
    if (stage) {
      stage.addEventListener('pointerenter', (event) => {
        // A new contact can acquire sparse plot space before any native mark receives its own entry.
        if (!ownsTooltipPointer(root, event)) updateNearestPoint(root, crosshair, tip, event);
      });
      stage.addEventListener('wheel', (event) => {
        if (!hasFeature(root, 'Zoom')) return;
        event.preventDefault();
        zoomBy(root, event.deltaY < 0 ? 1.08 : 0.92);
      }, { passive: false });
      let drag = null;
      stage.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        if (root.dataset.cfxMode === 'pan' && hasFeature(root, 'Pan')) {
          const state = getState(root);
          const point = stagePointer(stage, event);
          drag = { mode: 'pan', id: event.pointerId, x: point.x, y: point.y, panX: state.panX, panY: state.panY };
          event.preventDefault();
          stage.setPointerCapture(event.pointerId);
        } else if (root.dataset.cfxMode === 'brush' && hasFeature(root, 'Brush') && brush) {
          const point = stagePointer(stage, event, true);
          drag = { mode: 'brush', id: event.pointerId, left: point.x, top: point.y };
          brush.hidden = false;
          brush.style.left = drag.left + 'px';
          brush.style.top = drag.top + 'px';
          brush.style.width = '0px';
          brush.style.height = '0px';
          event.preventDefault();
          stage.setPointerCapture(event.pointerId);
        }
      });
      stage.addEventListener('pointermove', (event) => {
        if (!drag || drag.id !== event.pointerId) {
          if (!ownsTooltipPointer(root, event)) return;
          updateNearestPoint(root, crosshair, tip, event);
          return;
        }
        if (drag.mode === 'pan') {
          const point = stagePointer(stage, event);
          applyViewport(root, { zoom: getState(root).zoom, panX: drag.panX + point.x - drag.x, panY: drag.panY + point.y - drag.y });
        } else if (drag.mode === 'brush' && brush) {
          const { x, y } = stagePointer(stage, event, true);
          const left = Math.min(drag.left, x);
          const top = Math.min(drag.top, y);
          brush.style.left = left + 'px';
          brush.style.top = top + 'px';
          brush.style.width = Math.abs(x - drag.left) + 'px';
          brush.style.height = Math.abs(y - drag.top) + 'px';
        }
      });
      stage.addEventListener('pointerup', (event) => {
        if (!drag || drag.id !== event.pointerId) return;
        if (drag.mode === 'brush' && brush) {
          root.dataset.cfxBrush = [brush.style.left, brush.style.top, brush.style.width, brush.style.height].join(' ');
          syncResetControl(root);
          const selectedTargets = selectTargetsInBox(root, brush.getBoundingClientRect(), event.shiftKey);
          const replaceSelection = !event.shiftKey;
          emitHostEvent(root, 'cfxbrush', { bounds: root.dataset.cfxBrush });
          if (selectedTargets.length || replaceSelection) emitHostEvent(root, 'cfxlasso', { bounds: root.dataset.cfxBrush, count: selectedTargets.length, targets: selectedTargets });
          emitSync(root, { action: 'brush', bounds: root.dataset.cfxBrush });
          if (selectedTargets.length || replaceSelection) emitSync(root, { action: 'lasso', bounds: root.dataset.cfxBrush, targets: selectedTargets, replace: replaceSelection });
          publishCompare(root, true);
        } else if (drag.mode === 'pan') {
          emitHostEvent(root, 'cfxviewport', { state: getState(root) });
          emitSync(root, { action: 'viewport', state: getState(root) });
        }
        stage.releasePointerCapture(event.pointerId);
        drag = null;
      });
      stage.addEventListener('pointerleave', (event) => {
        if (!ownsTooltipPointer(root, event)) return;
        hideCrosshair(root, crosshair);
        clearHover(root, true, true);
        hideTip(root, tip, false);
      });
      stage.addEventListener('pointercancel', (event) => {
        if (drag && drag.id === event.pointerId) drag = null;
        if (!ownsTooltipPointer(root, event)) return;
        hideCrosshair(root, crosshair);
        clearHover(root, true, true);
        hideTip(root, tip, false);
      });
    }
    const reset = root.querySelector('[data-cfx-reset]');
    if (reset) window.addEventListener('resize', () => syncResetControl(root));
    if (reset) reset.addEventListener('click', () => {
      resetViewport(root);
      emitHostEvent(root, 'cfxreset', {});
      emitHostEvent(root, 'cfxviewport', { state: getState(root) });
      emitSync(root, { action: 'viewport', state: getState(root) });
      clearSelections(root);
      root.querySelectorAll('.cfx-series-muted').forEach((node) => node.classList.remove('cfx-series-muted'));
      root.querySelectorAll('[data-cfx-muted]').forEach((node) => node.removeAttribute('data-cfx-muted'));
      setSeriesIsolation(root, null, false);
      refreshKeyboardNavigation(root);
      clearFocusTrail(root);
      clearReveals(root);
      if (brush) brush.hidden = true;
      hideCrosshair(root, crosshair);
      hideTip(root, tip, true);
      if (root._cfxBranchHighlights) clearHover(root, true, true);
      publishCompare(root, true);
      syncResetControl(root);
    });
  });
})();
</script>
