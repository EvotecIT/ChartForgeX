<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check results over time</title>
<style>:root {
  color-scheme: light dark;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f172a;
  color: #e5e7eb;
  font-family: Inter, ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif;
}

.cfx-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

.cfx-shell > * {
  min-width: 0;
  max-width: 100%;
}

.cfx-dashboard {
  width: min(100%, 1440px);
  display: grid;
  grid-template-columns: repeat(var(--cfx-dashboard-columns, 2), minmax(0, 1fr));
  gap: 18px;
}

.cfx-interactive-chart {
  container: cfx-chart / inline-size;
  contain-intrinsic-inline-size: var(--cfx-intrinsic-width, 640px);
  position: relative;
  width: min(100%, 1200px);
  min-width: 0;
  max-width: 100%;
}

.cfx-dashboard .cfx-interactive-chart {
  width: 100%;
}

.cfx-stage {
  position: relative;
  background: #020617;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 12px;
  overflow: hidden;
  touch-action: auto;
}

.cfx-stage svg {
  margin: auto;
  transform: translate(var(--cfx-pan-x, 0), var(--cfx-pan-y, 0)) scale(var(--cfx-zoom, 1));
  transform-origin: center center;
  transition: transform .12s ease;
  will-change: transform;
}

.cfx-interactive-chart[data-cfx-responsive-layout="fit"] .cfx-stage svg,
.cfx-interactive-chart[data-cfx-responsive-layout="adaptive"] .cfx-stage svg {
  width: 100%;
  max-width: 100%;
  height: auto;
}

/* Readable sizing follows the chart's host, including narrow columns in a wide window. */
.cfx-interactive-chart[data-cfx-responsive-layout="readable"] .cfx-stage {
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-inline: contain;
  touch-action: auto;
}

.cfx-interactive-chart[data-cfx-mode="pan"] .cfx-stage,
.cfx-interactive-chart[data-cfx-mode="brush"] .cfx-stage {
  touch-action: none;
}

.cfx-interactive-chart[data-cfx-responsive-layout="readable"] .cfx-stage svg {
  width: 100%;
  min-width: min(var(--cfx-native-width, 640px), 38rem);
  max-width: none;
}

.cfx-toolbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  margin: 0 0 10px;
  padding: 0;
  border: 0;
  border-radius: 10px;
  background: rgba(15, 23, 42, .58);
}

.cfx-interactive-chart[data-cfx-toolbar="compact"] .cfx-toolbar {
  padding: 0;
  border: 0;
  background: none;
  gap: 4px;
}

.cfx-interactive-chart[data-cfx-toolbar="compact"] .cfx-toolbar .cfx-tool {
  flex: 0 0 auto;
  min-height: 28px;
  padding: 4px 7px;
  border-color: transparent;
  background: var(--cfx-tooltip-surface);
  color: var(--cfx-tooltip-muted);
}

.cfx-interactive-chart[data-cfx-toolbar="compact"] .cfx-toolbar .cfx-tool:hover,
.cfx-interactive-chart[data-cfx-toolbar="compact"] .cfx-toolbar .cfx-tool[aria-pressed="true"] {
  color: var(--cfx-tooltip-text);
  background: var(--cfx-tooltip-line);
}

.cfx-frame {
  position: relative;
  min-width: 0;
}

.cfx-interactive-chart[tabindex="-1"]:focus {
  outline: none;
}

/* Reserve the reset row so linked selections do not move the chart's following content. */
.cfx-reset {
  display: flex;
  width: max-content;
  margin: 8px 8px 0 auto;
  align-items: center;
  height: 28px;
  padding: 0 10px;
  border: 1px solid rgba(148, 163, 184, .45);
  border-radius: 6px;
  background: rgba(15, 23, 42, .78);
  color: #e5e7eb;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
}

.cfx-reset[hidden] {
  display: flex;
  visibility: hidden;
  pointer-events: none;
}

.cfx-reset:hover,
.cfx-reset:focus-visible {
  border-color: #38bdf8;
  color: #7dd3fc;
}

.cfx-scenarios {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 10px;
}

.cfx-tool,
.cfx-scenario {
  border: 1px solid #334155;
  border-radius: 6px;
  background: #111827;
  color: #e5e7eb;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  font-weight: 800;
  padding: 6px 9px;
}

.cfx-scenario {
  border-color: color-mix(in srgb, var(--cfx-scenario-color, #64748b) 45%, #334155);
}

.cfx-scenario::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 7px;
  border-radius: 999px;
  background: var(--cfx-scenario-color, #64748b);
}

.cfx-tool:hover,
.cfx-tool:focus-visible,
.cfx-tool[aria-pressed="true"],
.cfx-scenario:hover,
.cfx-scenario:focus-visible,
.cfx-scenario[aria-pressed="true"] {
  border-color: #38bdf8;
  color: #7dd3fc;
}

.cfx-scenario-panel {
  display: grid;
  gap: 8px;
  margin: 0 0 10px;
  padding: 10px 12px;
  border: 1px solid rgba(51, 65, 85, .95);
  border-radius: 8px;
  background: rgba(15, 23, 42, .78);
  color: #e5e7eb;
}

.cfx-scenario-panel__summary {
  display: grid;
  gap: 2px;
}

.cfx-scenario-panel__title {
  color: var(--cfx-scenario-color, #f8fafc);
  font-size: 14px;
  font-weight: 800;
}

.cfx-scenario-panel__meta {
  color: #94a3b8;
  font-size: 12px;
}

.cfx-scenario-panel__controls,
.cfx-scenario-panel__steps {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0;
  padding: 0;
}

.cfx-scenario-panel__steps {
  list-style: none;
}

.cfx-scenario-panel__steps li {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  padding: 3px 8px;
  border: 1px solid rgba(51, 65, 85, .95);
  border-radius: 6px;
  background: rgba(2, 6, 23, .52);
  color: #cbd5e1;
  cursor: pointer;
  font-size: 11px;
  font-weight: 800;
}

.cfx-scenario-panel__steps li::before {
  content: attr(data-cfx-scenario-step-index);
  display: inline-grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 999px;
  background: var(--cfx-scenario-color, #2563eb);
  color: #fff;
  font-size: 10px;
}

.cfx-scenario-panel__steps li[aria-current="step"] {
  border-color: var(--cfx-scenario-color, #38bdf8);
  color: #f8fafc;
}

.cfx-interactive-chart[data-cfx-scenario-playback="playing"] [data-cfx-scenario-step-control="play"] {
  border-color: var(--cfx-scenario-color, #38bdf8);
  background: color-mix(in srgb, var(--cfx-scenario-color, #38bdf8) 30%, rgba(15, 23, 42, .92));
  color: #fff;
}

.cfx-scenario-progress {
  position: relative;
  min-height: 24px;
  overflow: hidden;
  border: 1px solid rgba(51, 65, 85, .95);
  border-radius: 999px;
  background: rgba(2, 6, 23, .54);
  color: #dbeafe;
}

.cfx-scenario-progress[hidden] {
  display: none;
}

.cfx-scenario-progress__bar {
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--cfx-scenario-progress, 0%);
  border-radius: inherit;
  background: color-mix(in srgb, var(--cfx-scenario-color, #38bdf8) 46%, rgba(56, 189, 248, .2));
  transition: width .18s ease;
}

.cfx-scenario-progress__text {
  position: relative;
  z-index: 1;
  display: block;
  overflow: hidden;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 900;
  line-height: 1.2;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cfx-scenario-scrubber {
  width: 100%;
  min-height: 24px;
  margin: 0;
  accent-color: var(--cfx-scenario-color, #38bdf8);
  cursor: pointer;
}

.cfx-scenario-scrubber:disabled {
  cursor: default;
  opacity: .45;
}

.cfx-tooltip {
  position: fixed;
  z-index: 20;
  min-width: 180px;
  max-width: 320px;
  border: 1px solid rgba(56, 189, 248, .45);
  border-radius: 7px;
  background: rgba(15, 23, 42, .96);
  box-shadow: 0 12px 28px rgba(0, 0, 0, .26);
  color: #f8fafc;
  font-size: 12px;
  line-height: 1.35;
  padding: 8px 10px;
  pointer-events: none;
}

.cfx-tooltip--pinned {
  border-color: rgba(250, 204, 21, .7);
  box-shadow: 0 14px 32px rgba(0, 0, 0, .30), 0 0 0 1px rgba(250, 204, 21, .16) inset;
}

.cfx-tooltip--pinned::before {
  content: attr(data-cfx-pinned-label);
  display: block;
  margin-bottom: 4px;
  color: inherit;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .04em;
  text-transform: uppercase;
}

.cfx-tooltip__title {
  font-weight: 800;
  overflow-wrap: anywhere;
}

.cfx-tooltip__secondary {
  margin-top: 4px;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.cfx-tooltip__title--series {
  display: flex;
  align-items: center;
  gap: 6px;
}

.cfx-tooltip__swatch {
  display: inline-block;
  width: 10px;
  height: 10px;
  flex: 0 0 10px;
  border-radius: 2px;
}

.cfx-tooltip__meta {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 2px 10px;
  margin: 6px 0 0;
  color: #cbd5e1;
}

.cfx-tooltip__meta dt,
.cfx-tooltip__meta dd {
  margin: 0;
  min-width: 0;
}

.cfx-tooltip__meta dt {
  color: #94a3b8;
  font-weight: 700;
}

.cfx-tooltip__meta dd {
  overflow-wrap: anywhere;
}

.cfx-tooltip[hidden] {
  display: none;
}

.cfx-brush-box {
  position: absolute;
  z-index: 10;
  border: 1px solid rgba(56, 189, 248, .95);
  background: rgba(56, 189, 248, .18);
  pointer-events: none;
}

.cfx-brush-box[hidden] {
  display: none;
}

.cfx-crosshair {
  position: absolute;
  overflow: hidden;
  z-index: 9;
  pointer-events: none;
}

.cfx-crosshair[hidden] {
  display: none;
}

.cfx-crosshair__line {
  position: absolute;
  box-sizing: border-box;
  background: rgba(14, 165, 233, .58);
  box-shadow: 0 0 10px rgba(14, 165, 233, .18);
}

/* Center background and border strokes so clipping retains ink at either plot edge. */
.cfx-crosshair__line--x {
  left: 0;
  right: 0;
  top: var(--cfx-crosshair-y, 0);
  height: 1px;
  transform: translateY(-50%);
}

.cfx-crosshair__line--y {
  top: 0;
  bottom: 0;
  left: var(--cfx-crosshair-x, 0);
  width: 1px;
  transform: translateX(-50%);
}

.cfx-crosshair__label {
  position: absolute;
  left: 0;
  top: 0;
  box-sizing: border-box;
  width: max-content;
  max-width: min(210px, 100%);
  max-height: 100%;
  overflow: hidden;
  border: 1px solid rgba(14, 165, 233, .42);
  border-radius: 999px;
  background: rgba(15, 23, 42, .86);
  color: #e0f2fe;
  font-size: 11px;
  font-weight: 800;
  padding: 4px 8px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cfx-reveal-layer {
  position: absolute;
  inset: 0;
  z-index: 12;
  overflow: hidden;
  pointer-events: none;
}

.cfx-reveal-layer[hidden] {
  display: none;
}

.cfx-reveal-label {
  position: absolute;
  max-width: min(220px, calc(100% - 16px));
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--cfx-scenario-color, #38bdf8) 42%, rgba(15, 23, 42, .7));
  border-radius: 999px;
  background: color-mix(in srgb, var(--cfx-scenario-color, #38bdf8) 18%, rgba(2, 6, 23, .9));
  box-shadow: 0 10px 24px rgba(2, 6, 23, .28);
  color: #f8fafc;
  font-size: 11px;
  font-weight: 900;
  line-height: 1.15;
  padding: 5px 8px;
  text-overflow: ellipsis;
  transform: translateX(-50%);
  white-space: nowrap;
}

.cfx-reveal-label::before {
  content: attr(data-cfx-reveal-index);
  display: inline-grid;
  place-items: center;
  width: 16px;
  height: 16px;
  margin-right: 5px;
  border-radius: 999px;
  background: rgba(248, 250, 252, .16);
  color: #bae6fd;
  font-size: 10px;
}

.cfx-compare-tray {
  position: relative;
  z-index: 11;
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 6px;
  width: 100%;
  max-width: 100%;
  height: 47px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
  margin-top: 8px;
  contain: inline-size;
  border: 1px solid rgba(56, 189, 248, .36);
  border-radius: 8px;
  background: rgba(2, 6, 23, .82);
  box-shadow: 0 12px 28px rgba(0, 0, 0, .24);
  color: #e0f2fe;
  padding: 6px;
  pointer-events: auto;
}

.cfx-compare-tray[hidden] {
  display: flex;
  visibility: hidden;
  pointer-events: none;
}

.cfx-compare-tray__summary,
.cfx-compare-tray__range {
  flex: 0 0 auto;
  color: #7dd3fc;
  font-size: 11px;
  font-weight: 900;
  padding: 0 5px;
  white-space: nowrap;
}

.cfx-compare-chip,
.cfx-compare-page,
.cfx-compare-clear {
  min-width: 0;
  border: 1px solid rgba(56, 189, 248, .34);
  border-radius: 999px;
  background: rgba(15, 23, 42, .72);
  color: #f8fafc;
  cursor: pointer;
  font: inherit;
  font-size: 11px;
  font-weight: 800;
  line-height: 1;
  padding: 6px 8px;
}

.cfx-compare-chip {
  flex: 0 0 auto;
  max-width: min(220px, 75%);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cfx-compare-chip:hover,
.cfx-compare-chip:focus-visible,
.cfx-compare-page:hover:not(:disabled),
.cfx-compare-page:focus-visible {
  border-color: #7dd3fc;
  color: #bae6fd;
}

.cfx-compare-page { flex: 0 0 auto; white-space: nowrap; }
.cfx-compare-page:disabled { cursor: default; opacity: .5; }

.cfx-compare-clear {
  flex: 0 0 auto;
  margin-left: auto;
  border-color: rgba(250, 204, 21, .44);
  color: #fde68a;
}

.cfx-interactive-chart[data-cfx-mode="pan"] .cfx-stage {
  cursor: grab;
}

.cfx-interactive-chart[data-cfx-mode="pan"] .cfx-stage:active {
  cursor: grabbing;
}

.cfx-interactive-chart[data-cfx-mode="brush"] .cfx-stage {
  cursor: crosshair;
}

.cfx-interactive-chart [data-cfx-label],
.cfx-interactive-chart [data-cfx-point],
.cfx-interactive-chart [data-cfx-series],
.cfx-interactive-chart [data-cfx-role="legend-item"],
.cfx-interactive-chart .cfx-interactive-region {
  cursor: pointer;
}
.cfx-interactive-chart .cfx-selected:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-selected[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  filter: drop-shadow(0 0 8px rgba(56, 189, 248, .75));
  opacity: 1 !important;
  stroke-width: var(--cfx-interactive-focus-stroke-width, 2.4) !important;
}

.cfx-interactive-chart .cfx-hovered:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]):not(:where([data-cfx-hover-mode="root-branch"])) .cfx-hovered[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: 1 !important;
  filter: drop-shadow(0 0 10px rgba(125, 211, 252, .72));
  stroke-width: var(--cfx-interactive-hover-stroke-width, 2.5) !important;
}

.cfx-interactive-chart:not([data-cfx-look="graphite"]) .cfx-hover-related:not(:where([data-cfx-highlight-managed],.cfx-selected,.cfx-highlighted)),
.cfx-interactive-chart:not([data-cfx-highlight-probe]):not(:where([data-cfx-hover-mode="root-branch"])):not([data-cfx-look="graphite"]) .cfx-hover-related:not(:where(.cfx-selected,.cfx-highlighted))[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .82 !important;
  filter: drop-shadow(0 0 6px rgba(125, 211, 252, .34));
}

.cfx-interactive-chart:not([data-cfx-look="graphite"]):not(:where([data-cfx-hover-mode="root-branch"]))[data-cfx-hovering="true"] [data-cfx-series]:not(.cfx-hovered):not(.cfx-hover-related):not(.cfx-selected):not(:where([data-cfx-highlight-managed],.cfx-highlighted)),
.cfx-interactive-chart:not([data-cfx-highlight-probe]):not(:where([data-cfx-hover-mode="root-branch"])):not([data-cfx-look="graphite"])[data-cfx-hovering="true"] [data-cfx-series]:not(.cfx-hovered):not(.cfx-hover-related):not(.cfx-selected):not(:where(.cfx-highlighted))[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .38;
}

.cfx-interactive-chart .cfx-trail:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: 1 !important;
  filter: drop-shadow(0 0 9px rgba(34, 211, 238, .44));
}

.cfx-interactive-chart .cfx-trail[data-cfx-trail-index="1"]:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-trail-index="1"][data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  filter: drop-shadow(0 0 12px rgba(250, 204, 21, .72));
  stroke-width: var(--cfx-interactive-trail-stroke-width, 2.6) !important;
}

.cfx-interactive-chart .cfx-trail[data-cfx-trail-index="2"]:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-trail-index="2"][data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .86 !important;
}

.cfx-interactive-chart .cfx-trail[data-cfx-trail-index="3"]:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-trail-index="3"][data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .72 !important;
}

.cfx-interactive-chart .cfx-trail[data-cfx-trail-index="4"]:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart .cfx-trail[data-cfx-trail-index="5"]:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-trail-index="4"][data-cfx-highlight-managed] > [data-cfx-highlight-paint],
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-trail[data-cfx-trail-index="5"][data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .58 !important;
}

.cfx-interactive-chart .cfx-series-muted:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-series-muted[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .18 !important;
}

.cfx-interactive-chart .cfx-series-isolated-in:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-series-isolated-in[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: 1 !important;
  filter: drop-shadow(0 0 10px rgba(250, 204, 21, .34));
}

.cfx-interactive-chart .cfx-series-isolated-out:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-series-isolated-out[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .10 !important;
  filter: saturate(.35);
}

.cfx-interactive-chart [data-cfx-role="legend-item"][data-cfx-isolated="true"] {
  filter: drop-shadow(0 0 8px rgba(250, 204, 21, .55));
}

.cfx-interactive-chart .cfx-scenario-muted:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-scenario-muted[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: .46 !important;
  filter: saturate(.72);
}

.cfx-interactive-chart .cfx-scenario-active:not(:where([data-cfx-highlight-managed])),
.cfx-interactive-chart:not([data-cfx-highlight-probe]) .cfx-scenario-active[data-cfx-highlight-managed] > [data-cfx-highlight-paint] {
  opacity: 1 !important;
  filter: drop-shadow(0 0 8px color-mix(in srgb, var(--cfx-scenario-color, #38bdf8) 70%, transparent));
}

    requestXViewport(root, 'window', Math.min(first, last), Math.max(first, last), sync, accepted);
    return true;
  };
  // Alternate drawings are native preparations of the same source, not scaled desktop geometry.
  // Keep them inert: one root and controller own the active scene and every browser resource.
  const adaptiveTemplate = (root, name) => Array.from(root.children)
    .find(node => node instanceof HTMLTemplateElement && node.hasAttribute('data-cfx-adaptive-' + name));
  const adaptiveSectionCopy = section => {
    const copy = section.cloneNode(true);
    for (const name of ['wide', 'narrow']) adaptiveTemplate(copy, name)?.remove();
    copy.removeAttribute('data-cfx-runtime-bound');
    return copy;
  };
  const readAdaptiveLayout = root => {
    if (root.dataset.cfxResponsiveLayout !== 'adaptive') return null;
    const breakpoint = Number(root.dataset.cfxAdaptiveBreakpoint), current = root.dataset.cfxAdaptiveDrawing || 'wide';
    const narrowTemplate = adaptiveTemplate(root, 'narrow'), wideTemplate = adaptiveTemplate(root, 'wide');
    if (!Number.isFinite(breakpoint) || breakpoint <= 0 || !['wide', 'narrow'].includes(current)
      || !narrowTemplate || narrowTemplate.content.children.length !== 1
      || wideTemplate && wideTemplate.content.children.length !== 1 || current === 'narrow' && !wideTemplate)
      throw new TypeError('Adaptive charts require a valid breakpoint and matching native drawings.');
    const wide = wideTemplate ? adaptiveSectionCopy(readChartSection(wideTemplate.content.firstElementChild, true)) : adaptiveSectionCopy(root);
    const narrow = adaptiveSectionCopy(readChartSection(narrowTemplate.content.firstElementChild, true));
    const source = JSON.stringify(JSON.parse(wide.dataset.cfxPreparedChart).series);
    for (const section of [wide, narrow]) if (section.dataset.cfxChartId !== root.dataset.cfxChartId
      || section.dataset.cfxResponsiveLayout !== 'adaptive'
      || JSON.stringify(JSON.parse(section.dataset.cfxPreparedChart).series) !== source)
      throw new TypeError('Adaptive drawings must retain the same chart and source identities.');
    return { wide, narrow, breakpoint, current };
  };
  const prepareAdaptiveRoot = (root, lifetime) => {
    const adaptive = lifetime.adaptive;
    if (!adaptive) return;
    root.dataset.cfxAdaptiveDrawing = adaptive.current;
    for (const name of ['wide', 'narrow']) {
      adaptiveTemplate(root, name)?.remove();
      const template = root.ownerDocument.createElement('template');
      template.setAttribute('data-cfx-adaptive-' + name, 'true');
      template.content.appendChild(adaptive[name].cloneNode(true));
      root.appendChild(template);
    }
  };
  const bindAdaptiveLayout = root => {
    const lifetime = chartLifetimes.get(root), adaptive = lifetime?.adaptive;
    if (!adaptive) return;
    let frame = 0;
    const refresh = () => {
      frame = 0;
      if (lifetime.disposed || chartLifetimes.get(root) !== lifetime || !root.isConnected) return;
      const width = root.getBoundingClientRect().width;
      if (width <= 0) return;
      const drawing = width < adaptive.breakpoint ? 'narrow' : 'wide';
      if (drawing === adaptive.current) return;
      const previousSceneRevision = lifetime.sceneRevision;
      replaceChartSection(root, lifetime, adaptive[drawing].cloneNode(true), '', drawing);
      emitHostEvent(root, 'cfxlayoutchange', { drawing, previousSceneRevision, sceneRevision: lifetime.sceneRevision });
    };
    const queue = () => { if (!frame) frame = requestAnimationFrame(refresh); };
    const observer = typeof ResizeObserver === 'undefined' ? null : new ResizeObserver(queue);
    observer?.observe(root);
    if (!observer) listenChart(root, window, 'resize', queue);
    ownChartWork(root, () => { observer?.disconnect(); if (frame) cancelAnimationFrame(frame); });
    queue();
  };
  const chartRoot = target => typeof target === 'string' ? document.querySelector(target) : target;
  const mountChart = target => {
    const root = chartRoot(target);
    const existing = root && chartLifetimes.get(root);
    if (existing && !root.isConnected) { existing.controller.dispose(); throw new TypeError('Mount the chart after inserting its section into the document.'); }
    if (existing && !existing.disposed) return existing.controller;
    readChartSection(root);
    if (!root.isConnected) throw new TypeError('Mount the chart after inserting its section into the document.');
    const lifetime = { cleanups: new Set(), disposed: false, controller: null, xViewportConnection: null,
      xViewportPending: null, sceneRevision: nextChartSceneRevision() };
    lifetime.adaptive = readAdaptiveLayout(root);
    const requireMounted = () => {
      if (lifetime.disposed || !root.isConnected) { controller.dispose(); throw new Error('The chart controller is disposed; mount the connected section again.'); }
    };
    const controller = Object.freeze({
      root,
      get sceneRevision() { return lifetime.sceneRevision; },
      select: (match, options) => { requireMounted(); runSelectionCommand(root, match, options); return controller; },
      clearSelection: options => { requireMounted(); clearSelectionCommand(root, options); return controller; },
      clearBrush: options => { requireMounted(); clearBrushCommand(root, options); return controller; },
      getSelection: () => { requireMounted(); return copyHostValue(selectedTargets(root)); },
      resolveTargets: match => { requireMounted(); return resolveHostTargets(root, match); },
      highlight: (match, options) => { requireMounted(); runHighlightCommand(root, match, options); return controller; },
      clearHighlight: options => { requireMounted(); clearHighlightCommand(root, options); return controller; },
      unpinTooltip: () => { requireMounted(); unpinTooltip(root); return controller; },
      update: section => {
        requireMounted();
        const next = readChartSection(section, true).cloneNode(true);
        replaceChartSection(root, lifetime, next);
        emitHostEvent(root, 'cfxupdated', {});
        return controller;
      },
      connectXViewport: connection => {
        requireMounted();
        if (connection !== null && typeof connection !== 'function') throw new TypeError('Expected an X viewport callback or null to disconnect.');
        cancelXViewportRequest(lifetime);
        lifetime.xViewportConnection = connection;
        if (connection) applyViewport(root, { zoom: 1, panX: 0, panY: 0 });
        syncXViewportControls(root);
        return controller;
      },
      getXWindow: () => { requireMounted(); return copyHostValue(nativeXWindow(root)); },
      setXWindow: (minimum, maximum) => {
        requireMounted();
        if (!requestNativeXWindow(root, { minimum, maximum }))
          throw new TypeError('A native X window requires a connected supported chart and finite increasing source bounds.');
        return controller;
      },
      resize: () => {
        requireMounted(); hideCrosshair(root, root.querySelector('.cfx-crosshair'));
        refreshKeyboardNavigation(root); refreshTooltipPosition(root); syncResetControl(root);
        return controller;
      },
      dispose: () => { if (!lifetime.disposed) releaseChartLifetime(root); }
    });
    lifetime.controller = controller; chartLifetimes.set(root, lifetime); mountedCharts.add(root);
    try { prepareAdaptiveRoot(root, lifetime); bindChart(root); bindAdaptiveLayout(root); watchChartLifetimes(); } catch (error) { releaseChartLifetime(root); throw error; }
    return controller;
  };
  // Shared assets may be registered by more than one fragment. One installed runtime owns all controllers.
  window.ChartForgeXCharts = Object.freeze({ mount: mountChart,
    get: target => { const root = chartRoot(target), lifetime = root?.isConnected && chartLifetimes.get(root); return lifetime && !lifetime.disposed ? lifetime.controller : null; } });
  document.querySelectorAll('.cfx-interactive-chart').forEach(root => mountChart(root));
})();
</script>
</body>
</html>
